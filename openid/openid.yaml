# openid/openid.yaml — the OpenID Connect provider's contract.
#
# This is a SEPARATE document from openapi/v1.yaml, and the separation is the
# point rather than tidiness.
#
# core's docs/openapi-conventions.md says every path in a cafaye service's
# contract is under a single /v1 prefix. RFC 8414 and OpenID Connect Discovery
# fix the paths of the metadata and key endpoints at /.well-known/…, and this
# service puts its protocol endpoints under /oidc so the two surfaces stay
# distinguishable in an access log. A document containing both would break one of
# the two rules, so it is two documents:
#
#   openapi/v1.yaml   the cafaye JSON API. /v1/*. Every non-2xx is
#                     application/problem+json, and it is what `exposes.api` in
#                     cafaye.yml points at.
#   openid/openid.yaml  the OAuth 2.0 and OIDC protocol surface. Errors are
#                     RFC 6749's {"error": …} and nothing else, because an
#                     off-the-shelf client library cannot parse a problem
#                     document and the entire purpose of this surface is that one
#                     can.
#
# WHAT IS DIFFERENT HERE, and each is a decision rather than an oversight:
#
#  * The error envelope. RFC 6749 §5.2 for the endpoints, and ONE exception: the
#    pre-checks on /oidc/authorize (an unknown scope, a missing or non-S256
#    code_challenge, prompt=login, max_age) answer 400 with core's problem
#    envelope and code `invalid_request`. Those are cafaye decisions about a
#    cafaye request rather than OAuth protocol responses, and the sentence in
#    `detail` is what a developer configuring a product needs to see. Every other
#    refusal on these paths, including every one the library makes, is RFC 6749.
#  * No `/v1` prefix, for the reason above.
#  * This document is NOT `exposes.api`. core's manifest schema has one field for
#    it and it points at the cafaye API, which is where SDK generation and the
#    contract tests want to look. This document is a published contract for
#    third-party and first-party products to code against and nothing generates
#    from it.
#
# Validated with:
#
#   openapi-spec-validator openid/openid.yaml
#
# and against OpenAPI 3.1.0, which is the version cafaye core specifies.
openapi: 3.1.0

info:
  title: cafaye identity — OpenID Connect provider
  version: 1.0.0
  summary: |
    The OpenID Connect provider side of `identity`: discovery, the
    authorization-code flow with PKCE, the key set, and userinfo.
  description: |
    `identity` is a first-class OpenID Connect **provider**. Any product —
    anytalk, anymark, anygate — signs users in against cafaye itself rather than
    configuring Google OAuth separately per product, and the verification every
    other cafaye service already does against identity's JWKS becomes a standard,
    interoperable surface rather than a private arrangement.

    The registrations that decide who may use this surface are managed through the
    cafaye API in `openapi/v1.yaml` at `/v1/accounts/{account_id}/oidc-clients`,
    owner-only.

    ## One key, one issuer, one document

    The signing key is configured, not generated: `OIDC_SIGNING_KEY` and
    `OIDC_SIGNING_KEY_ID`. It is the same key whose public half is served here and
    which `guard` verifies every request against, and there is no second one. A key
    generated at boot would publish a document no caching verifier has seen, and
    two processes behind a load balancer would each publish a different one.

    ## The flow

    ```
    GET  /oidc/authorize    -> 302 /oidc/login/{request_id}          (this service)
    GET  /oidc/login/{id}   -> 302 <OIDC_LOGIN_UI_URL>?…             (the login UI)
    POST /oidc/login/{id}   -> 302 <redirect_uri>?code=…&state=…     (this service)
                             …or 302 back to the login UI carrying the refusal
    POST /oidc/token        -> {access_token, id_token, token_type, expires_in, scope}
    GET  /oidc/userinfo     -> {sub, email, email_verified, name, accounts}
    ```

    Authorization Code with PKCE, `S256` only. `state` and `nonce` are generated by
    the client, echoed back untouched, and `nonce` is asserted in the ID token.

    ## What this provider does not do

    Every one of these is a refusal rather than a silent omission, so a product
    finds out at configuration time rather than at its outage:

    * No refresh tokens. Access tokens live fifteen minutes and there is no way to
      renew one.
    * No implicit flow, no client credentials, no JWT profile grant, no
      `private_key_jwt` client authentication, no dynamic client registration.
    * No introspection, no revocation endpoint, no end-session, no device flow.
      A token is verified locally against the key set and the row behind its `jti`.
    * No consent screen. The registered client is trusted for the scopes it
      registered, and the scopes are intersected with what the provider supports.
    * No `prompt=login`, `prompt=consent` or `max_age`. A 400, because this
      provider does not re-authenticate a signed-in user and a product that asked
      and got a silent sign-in would have been told the session was
      re-established when it was not.

    The discovery document says all of this by omission, which is the only way it
    can: a document advertising an endpoint that answers 404 is a product
    configured against a route that does not exist.

    ## This provider renders no HTML

    **The sign-in form is not part of this service.** `/oidc/login/{request_id}`
    is this service's own sign-in — its own sessions, its own cookie, the same
    `POST /v1/session` credentials, the same lockout counter — and the page a
    person fills in is configured per deployment as `OIDC_LOGIN_UI_URL` and served
    by `parlor`. A separate sign-in for OIDC would be a second credential store,
    which is the one thing a security boundary must not have; equally, a second
    piece of frontend in a service whose job is to hold every user's password
    digest is not a thing this service should own.

    A deployment that configures an issuer, a signing key and no login UI **refuses
    to start**. A provider that cannot send a browser anywhere to authenticate is
    a provider that publishes a working discovery document and cannot complete a
    single flow, which is worse than not being a provider because the failure is
    found by a user rather than by an operator.

    Nothing in this service answers with a document. A redirect is a redirect with
    no body and no `Content-Type`, and a mistake here is one `http.Redirect` call
    away — so `internal/platform/ci` walks the router and the source on every
    commit and refuses either.

    ### The redirect contract

    `GET /oidc/login/{request_id}` answers `302` to `<OIDC_LOGIN_UI_URL>` with these
    query parameters. `request_id`, `state` and `step` are always present; the rest
    appear when they have something to say, and **an absent `error` and an empty one
    are different** — a login UI that switches on `error` must not see a failure on
    a sign-in that is going fine.

    | Parameter | Meaning |
    |---|---|
    | `request_id` | The authorization request. Post it back in your form's action path — it is the one value you cannot lose. |
    | `state` | A CSRF token this provider minted and sealed in a `__Host-` cookie **on this origin**. Your origin can neither read nor write that cookie; the POST is checked against it and a mismatch is refused. Post it back verbatim. |
    | `step` | `password` or `challenge`. Which form to render. |
    | `client_name` | The registration's display name. **Untrusted text**: it is whatever an account owner typed, so escape it. |
    | `login_hint` | The client's `login_hint`, if it sent one. Untrusted, and never load-bearing — the password is checked against the address the user types. |
    | `error` | A stable code. The contract; switch on it. |
    | `error_detail` | A sentence for a person. **Not** the contract and not parsed by anything. |
    | `retry_after` | Whole seconds, on `account_locked` and nowhere else. |

    The `error` codes are `interaction_expired`, `missing_credentials`,
    `invalid_credentials`, `challenge_rejected` and `account_locked`. The last one is
    the same word the JSON surface uses for the same lockout, on purpose: a UI that
    already switches on `account_locked` must not have to learn a second spelling.

    ### The form post

    `POST /oidc/login/{request_id}`, `application/x-www-form-urlencoded`, with
    `{state, email, password}` on the first step and `{state, code}` on the second.
    `code` is a TOTP code or a recovery code in the same field.

    ### The two cookies, and why they are `SameSite=None`

    The form is a top-level cross-site POST, so the state cookie and the
    MFA-challenge cookie are `SameSite=None; Secure`. That is a transport change and
    not a weakening: both are `HttpOnly` and `__Host-`-prefixed, so your origin can
    neither read nor forge them, and the CSRF property is the unguessable value in a
    cookie your origin cannot read — which is unchanged. Under `Lax` the flow would
    simply not work, and would fail on the first person to try it.

    The flow cookie and the session cookie stay `Lax`. Nothing you do needs to
    change them.

    ## A second factor is a second step

    A correct password on an account that has enrolled a second factor does not
    sign anybody in. The POST answers `302` back to your login UI with
    `step=challenge`, and no authorization code is minted until a code is answered.

    This is the same use case `POST /v1/session/mfa` is, and the same guarantee: a
    product integrating against this provider cannot obtain a token for a user
    with multi-factor authentication by knowing their password. A user who fails
    the second step is sent back to `step=challenge` with one sentence that does not
    say which part was wrong, and the challenge survives so the next code they type
    is the code that works.

    The contract a *client* sees from outside does not move. `/oidc/authorize`
    still answers 302, and the flow still ends at a `302` to the client's
    `redirect_uri` with a `code`. No discovery metadata changes.
  contact:
    name: identity
    url: https://github.com/cafaye/identity
    email: identity@cafaye.com
  license:
    name: MIT
    url: https://opensource.org/license/mit

servers:
  - url: https://identity.cafaye.com
    description: production
  - url: http://localhost:8080
    description: |
      local development. The issuer is whatever `OIDC_ISSUER` is set to, and it
      MUST equal the server URL plus nothing — a token's `iss` is compared for
      equality by every verifier, and a document whose issuer is not the address
      the client reached is a document nothing verifies.

tags:
  - name: discovery
    description: |
      The metadata and key documents a client fetches before it has authenticated
      anything.
  - name: oidc
    description: The authorization-code flow, the token endpoint and userinfo.

paths:
  /.well-known/openid-configuration:
    get:
      tags: [discovery]
      operationId: openidConfiguration
      summary: OpenID Provider metadata
      description: |
        OpenID Connect Discovery 1.0 §3 and RFC 8414 §3, one document at both
        well-known paths. A client may fetch either.

        Every endpoint this service does not serve is ABSENT from the document
        rather than advertised: introspection, revocation, end-session, device
        authorization and the session-management iframe. `grant_types_supported`
        is `["authorization_code"]` and `response_types_supported` is `["code"]`,
        even though the library behind this service can do more — the document
        describes what `identity` does, not what its dependencies can.
      security: []
      responses:
        '200':
          description: The metadata.
          headers:
            Cache-Control:
              description: |
                Public and cacheable. The document changes when the signing key
                does, and a `no-store` would mean every client in the platform
                re-fetched it on a timer nobody can see.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discovery'
              example:
                issuer: https://identity.cafaye.com
                authorization_endpoint: https://identity.cafaye.com/oidc/authorize
                token_endpoint: https://identity.cafaye.com/oidc/token
                userinfo_endpoint: https://identity.cafaye.com/oidc/userinfo
                jwks_uri: https://identity.cafaye.com/.well-known/jwks.json
                scopes_supported: [openid, email, profile, accounts]
                response_types_supported: [code]
                grant_types_supported: [authorization_code]
                subject_types_supported: [public]
                id_token_signing_alg_values_supported: [RS256]
                token_endpoint_auth_methods_supported: [client_secret_basic]
                code_challenge_methods_supported: [S256]
                claims_supported:
                  - sub
                  - iss
                  - aud
                  - exp
                  - iat
                  - jti
                  - nonce
                  - auth_time
                  - amr
                  - azp
                  - at_hash
                  - c_hash
                  - client_id
                  - scope
                  - email
                  - email_verified
                  - name
                  - accounts

  /.well-known/oauth-authorization-server:
    get:
      tags: [discovery]
      operationId: oauthAuthorizationServerMetadata
      summary: OAuth 2.0 Authorization Server metadata
      description: |
        The same document as `/.well-known/openid-configuration`, at the path RFC
        8414 names. This service registers it itself: the library behind it has
        exactly one well-known route, and a 404 at a path a conformant client is
        entitled to fetch is a 404 it has no way to interpret.
      security: []
      responses:
        '200':
          description: The same document as the OpenID Connect one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discovery'

  /.well-known/jwks.json:
    get:
      tags: [discovery]
      operationId: jsonWebKeySet
      summary: The published signing keys
      description: |
        RFC 7517. One key, `use: sig`, `alg: RS256`, and a `kid` that is the one
        this service signs under — the same `kid` that appears in the header of
        every token it issues.

        The private half is never here. A document with a `kid` and no `n` matches
        a token and then fails it, and a document with a `d` is a compromise of
        every token in the platform.
      security: []
      responses:
        '200':
          description: The key set.
          headers:
            Cache-Control:
              description: Public and cacheable for five minutes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeySet'
              example:
                keys:
                  - kty: RSA
                    kid: cafaye-2026-09
                    alg: RS256
                    use: sig
                    n: uS3V…(base64url of the modulus)
                    e: AQAB

  /oidc/authorize:
    get:
      tags: [oidc]
      operationId: authorize
      summary: Start an authorization request
      description: |
        The authorization endpoint. On success it redirects the browser to this
        service's own sign-in interaction at `/oidc/login/{request_id}`; that
        endpoint either sends the browser straight on to the client's registered
        `redirect_uri` with a `code`, or on to the configured login UI, which
        renders a step and posts it back.

        **PKCE is required and `S256` is the only accepted method.** `plain` means
        the verifier IS the challenge, which is only safe for a public client that
        has no secret to steal, and every client in this service is confidential.

        **`redirect_uri` is matched EXACTLY** against the registration. No prefix,
        no glob, no pattern. `https://app.example.com.evil.com/cb` is not a match
        for a registered `https://app.example.com/cb`.

        **The scopes must be ones this provider implements**, and `openid` must be
        among them. An unknown scope is a 400 rather than a token that quietly
        omits the claim the product is about to render.

        `prompt=none` is answered with `login_required`, redirected to the
        registered `redirect_uri` as RFC 6749 §4.1.2.1 requires.
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema: { type: string }
        - name: redirect_uri
          in: query
          required: true
          description: Must equal a registered `redirect_uri` character for character.
          schema: { type: string, format: uri }
        - name: response_type
          in: query
          required: true
          schema: { type: string, enum: [code] }
        - name: scope
          in: query
          required: true
          description: Space-delimited. Must include `openid`.
          schema: { type: string, example: 'openid email profile accounts' }
        - name: state
          in: query
          required: false
          description: The client's CSRF value. Echoed back untouched.
          schema: { type: string }
        - name: nonce
          in: query
          required: false
          description: |
            Echoed into the ID token's `nonce` claim. A client that does not send
            one and does not check the claim cannot detect a replayed ID token.
          schema: { type: string }
        - name: code_challenge
          in: query
          required: true
          schema: { type: string }
        - name: code_challenge_method
          in: query
          required: true
          schema: { type: string, enum: [S256] }
        - name: prompt
          in: query
          required: false
          description: Only `none` is accepted. `login`, `consent` and `select_account` are 400.
          schema: { type: string, enum: [none] }
        - name: max_age
          in: query
          required: false
          description: Not implemented. Sending it is a 400.
          schema: { type: integer }
      responses:
        '302':
          description: |
            To this service's sign-in interaction, on a request that has been
            validated. The browser is not sent to `redirect_uri` yet: no code
            exists until a user has authenticated.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
        '400':
          description: |
            One of two shapes, and which one is decided by whether the
            `redirect_uri` itself was acceptable.

            A `redirect_uri` that is not on the registration, or a malformed
            request, is rendered HERE as RFC 6749 §4.1.2.1 requires — the
            failure is never redirected to a URL the client has not proved it
            registered, because redirecting to an attacker's origin is the same
            open redirect with better manners.

            The pre-checks (an unknown scope, a missing or non-S256
            `code_challenge`, `prompt=login`/`consent`/`select_account`, `max_age`)
            are the exception and use core's problem envelope with code
            `invalid_request`. They are a cafaye decision about a cafaye request
            rather than an OAuth protocol response, and the sentence in `detail`
            names the offending parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://errors.cafaye.com/invalid_request
                title: Invalid request
                status: 400
                detail: 'unknown scope "phone"; this provider implements openid email profile accounts'
                instance: /oidc/authorize
                code: invalid_request
                trace_id: 0af7651916cd43dd8448eb211c80319c
    post:
      tags: [oidc]
      operationId: authorizeViaPost
      summary: Start an authorization request, by POST
      description: |
        **The same operation as `authorize`, delivered by POST.** OpenID Connect
        Core §3.1.2.1 requires the authorization endpoint to accept both methods,
        and a product behind a strict corporate proxy may have no choice; the same
        handler answers both and `registerOIDCRoutes` mounts both for exactly that
        reason. It is a second operation rather than a documented `get` because a
        generated client has one method per (method, path) and a client behind
        such a proxy needs the method the generator did not think to emit.

        Every parameter is unchanged and arrives in an
        **`application/x-www-form-urlencoded` body** instead of the query string.
        The handler reads `r.Form`, which covers both, so the pre-checks and the
        library see the same values whichever method delivered them.

        The four pre-checks are the same four — an unknown scope or a request with
        no `openid`, a missing or non-`S256` `code_challenge`,
        `prompt=login`/`consent`/`select_account`, and `max_age` — and they answer
        `application/problem+json` with code `invalid_request`, **before** anything
        is stored and before a browser is redirected anywhere. `prompt=none` is
        still not one of them.

        **This does not relax anything about `redirect_uri`.** A `redirect_uri`
        that is not on the registration is still rendered here as RFC 6749
        §4.1.2.1 requires and is never redirected to, because redirecting to an
        origin the client has not proved it registered is the same open redirect
        with better manners — and a POST is not a less dangerous way to arrive.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, redirect_uri, response_type, scope, code_challenge, code_challenge_method]
              properties:
                client_id:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                  description: Must equal a registered `redirect_uri` character for character.
                response_type:
                  type: string
                  enum: [code]
                scope:
                  type: string
                  description: Space-delimited. Must include `openid`.
                  example: 'openid email profile accounts'
                state:
                  type: string
                  description: The client's CSRF value. Echoed back untouched.
                nonce:
                  type: string
                  description: Echoed into the ID token's `nonce` claim.
                code_challenge:
                  type: string
                code_challenge_method:
                  type: string
                  enum: [S256]
                prompt:
                  type: string
                  enum: [none]
                  description: Only `none` is accepted. `login`, `consent` and `select_account` are 400.
                max_age:
                  type: integer
                  description: Not implemented. Sending it is a 400.
      responses:
        '302':
          description: |
            To this service's sign-in interaction, on a request that has been
            validated. The browser is not sent to `redirect_uri` yet: no code
            exists until a user has authenticated.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
        '400':
          description: |
            Two shapes, chosen by whether the `redirect_uri` itself was acceptable.

            A `redirect_uri` that is not on the registration, or a malformed
            request, is rendered HERE as RFC 6749 §4.1.2.1 requires. The
            pre-checks (an unknown scope, a missing or non-S256
            `code_challenge`, `prompt=login`/`consent`/`select_account`, `max_age`)
            are the exception and use core's problem envelope with code
            `invalid_request`, naming the offending parameter in `detail`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://errors.cafaye.com/invalid_request
                title: Invalid request
                status: 400
                detail: 'unknown scope "phone"; this provider implements openid email profile accounts'
                instance: /oidc/authorize
                code: invalid_request
                trace_id: 0af7651916cd43dd8448eb211c80319c

  /oidc/authorize/callback:
    get:
      tags: [oidc]
      operationId: authorizeCallback
      summary: The sign-in interaction's return leg
      description: |
        Where this service sends the browser once a user has authenticated. It
        mints the authorization code and redirects to the client's `redirect_uri`.
        This is the only place a code is minted.

        Not called by clients, and not called by the login UI either: the POST to
        `/oidc/login/{request_id}` completes the request and proxies a request to
        here, so a credential never crosses an origin boundary. It exists because
        the protocol has to hand control to something that is not the protocol.
      security: []
      parameters:
        - name: id
          in: query
          required: true
          description: The authorization request this login completed.
          schema: { type: string, format: uuid }
      responses:
        '302':
          description: |
            To the registered `redirect_uri` with `code` and `state` in the query.
            The code lives sixty seconds and is redeemable exactly once, by the
            holder of the `code_verifier` that produced the challenge.
          headers:
            Location:
              schema: { type: string, format: uri }
        '400':
          description: The request is unknown, expired, or nobody authenticated it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /oidc/token:
    post:
      tags: [oidc]
      operationId: token
      summary: Exchange an authorization code for tokens
      description: |
        The token endpoint. `grant_type=authorization_code` and nothing else.

        Client authentication is HTTP Basic with the `client_id` and the
        `client_secret` from the registration. A revoked client and a wrong secret
        are one `invalid_client`, and "no such client" is the same one: a caller
        who could tell them apart would have an oracle for which products are
        registered on this platform.

        The code is single-use. Redeeming it twice is `invalid_grant`, whether the
        second attempt is a replay of a captured code or a client retrying a
        request it already had answered — the gate is one conditional `UPDATE`, so
        it holds when two requests carrying the same code arrive at the same
        instant, not only when they arrive one after the other.

        `redirect_uri` must equal the one in the authorization request. A client
        that registered two origins and swaps the one in this request is asking for
        a code to be redeemed against a flow it did not start.
      security:
        - clientBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, code, redirect_uri, code_verifier]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code]
                code:
                  type: string
                  description: 60 seconds, one use, bound to the code_verifier below.
                redirect_uri:
                  type: string
                  format: uri
                code_verifier:
                  type: string
                  minLength: 43
                  maxLength: 128
      responses:
        '200':
          description: The tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: |
            `invalid_grant` — the code is unknown, spent, expired, or the verifier
            or the redirect_uri does not match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: |
            `invalid_client` — the credential is wrong, the client does not exist,
            or the client is revoked. One answer for all three.
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /oidc/userinfo:
    get:
      tags: [oidc]
      operationId: userinfo
      summary: The claims a token was granted
      description: |
        Returns the claims the ACCESS TOKEN was granted, and only those. A token
        granted `openid email` cannot ask for `accounts`, because holding a token
        proves nothing about what it was granted.

        `email_verified` is present and is **always `false`**: this service has no
        email-verification column yet, so there is nothing here that could prove an
        address, and `true` would be a claim about something nobody has checked.
        The field is written explicitly rather than omitted, because a relying
        party that cannot see the claim has to decide whether the provider supports
        verification — and "absent" means "assume verified".

        `name` is the personal account's name, derived from the email's local
        part. It is a stand-in, not a user-chosen name: this service has no name
        fields, and the one human-legible name it holds about a person is the
        account it created for them.

        A token for a revoked client, or one whose registration has been revoked
        since, is refused. Revocation is not advisory here: revoking a
        registration also revokes every token issued against it, in the same
        transaction, because a JWT is verifiable by anybody holding the published
        key set until its `exp` arrives.
      security:
        - accessToken: []
      responses:
        '200':
          description: The claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          description: No token, or one this service will not honour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '403':
          description: |
            The token is valid but identifies nobody — it carries no `openid`
            scope, and so there is no subject to describe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
    post:
      tags: [oidc]
      operationId: userinfoViaPost
      summary: The claims a token was granted, by POST
      description: |
        **The same operation as `userinfo`, with the token in the body.** OpenID
        Connect Core §5.3.1 requires the userinfo endpoint to accept `POST` with
        `access_token` as a form field, and the same handler answers both because
        `registerOIDCRoutes` mounts both.

        **The one difference is where the token comes from, and it is worth being
        exact about.** The `Authorization: Bearer` header is read **first** and
        still wins; the form body is consulted only when there is no `Authorization`
        header at all. So this operation does not require the form — it accepts it,
        and a client that already sends the header has nothing to change.

        `access_token` is a single form field, `application/x-www-form-urlencoded`,
        and nothing else is read from the body.

        **Nothing about the claims changes.** The token still returns only what it
        was granted, `email_verified` is still always `false`, a token for a
        revoked registration is still refused, and the 403 for a token carrying no
        `openid` scope still has no subject to describe. Moving the token from a
        header to a body is a transport change and deliberately not a capability
        change: a POST here grants nothing the GET did not.

        A token in a request body is a token in a place intermediaries log more
        eagerly than a header. The GET is the right default for a first-party
        client; this exists because the specification requires it and a product
        behind a proxy may have no other choice.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [access_token]
              properties:
                access_token:
                  type: string
                  description: |
                    The access token, in the body rather than in an
                    `Authorization` header. Ignored when the header is present.
      responses:
        '200':
          description: The claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          description: No token, or one this service will not honour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '403':
          description: |
            The token is valid but identifies nobody — it carries no `openid`
            scope, and so there is no subject to describe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /oidc/login/{request_id}:
    parameters:
      - name: request_id
        in: path
        required: true
        description: The authorization request being completed.
        schema: { type: string, format: uuid }
    get:
      tags: [oidc]
      operationId: oidcLoginStep
      summary: Begin the sign-in interaction
      description: |
        **This operation renders nothing.** It is where the authorization
        protocol hands control to a person, and it hands that control to the login
        UI configured as `OIDC_LOGIN_UI_URL`, with a `302` carrying everything the
        UI needs to render a step. The credential checks, the session cookie and
        the authorization code all stay on this service.

        Two outcomes, and they are the only two:

        * **A caller who already has a session** is sent straight through to the
          client's `redirect_uri` with a code. That is what makes signing in to a
          second product not require typing the same password again, and it is what
          `id_token_hint` needs.
        * **A caller who does not** gets a `302` to the login UI with a freshly
          minted `state`, sealed in a `__Host-` cookie **on this origin**. A
          cross-site POST cannot write a `__Host-` cookie, so a POST whose form and
          cookie disagree is refused — that is the defence against a request
          binding a user's browser to an authorization request they never chose.

        **A signed-in browser with no flow cookie is a 403, not a redirect.** The
        flow cookie is set at `/oidc/authorize` and marks a browser this service
        handed a flow to. A browser that arrives here with a session and nothing
        else has been navigated by somebody else, and completing its request would
        be login CSRF: the attacker chose the client, holds its secret and its PKCE
        verifier, and would receive an `id_token` whose subject is the victim. The
        product restarts the flow from its own redirect, which sets the cookie on
        the way past.
      security: []
      responses:
        '302':
          description: |
            Either to the login UI, or — for a caller who already has a session —
            to the client's `redirect_uri` with a code.

            The response has **no body and no `Content-Type`**. That is deliberate
            and it is checked: `http.Redirect` would write a small HTML anchor and
            set `Content-Type: text/html; charset=utf-8`, because RFC 9110 §15.4
            recommends it for user agents that cannot follow a redirect. This
            service has no such user agent and serves no documents.
          headers:
            Location:
              description: |
                The configured login UI, with `request_id`, `state`, `step`,
                `client_name` and — on a refusal — `error`, `error_detail` and
                `retry_after` in the query. Or the client's `redirect_uri` on the
                silent path.
              schema: { type: string, format: uri }
            Referrer-Policy:
              description: |
                Always `no-referrer`. The `Location` carries an authorization
                request id and a CSRF state, and this header is what governs what
                the login UI's own document may hand to whatever it loads next.
              schema: { type: string }
            Cache-Control:
              description: Always `no-store`. Nothing about a sign-in is cacheable.
              schema: { type: string }
        '403':
          description: |
            A signed-in browser that cannot prove it started this flow. The
            `403` rather than a `401` because the caller *is* authenticated; a
            `401` would send a client hunting a login problem that does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: |
            The request is unknown or has outlived its ten minutes. The one
            refusal that is a problem document rather than a redirect: there is no
            request left to show, so there is nothing for the login UI to render.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      tags: [oidc]
      operationId: oidcLoginSubmit
      summary: Submit a step of the sign-in interaction
      description: |
        Checks the credentials against this service's own `POST /v1/session`
        path, sets the `__Host-session` cookie, and hands the browser to the
        authorize callback — or, on a refusal, hands it back to the login UI with
        the reason.

        **This is a cross-site form post.** The form is on the login UI's origin
        and this endpoint is on this one, so the `state` and MFA-challenge cookies
        are `SameSite=None; Secure` for the duration of the interaction. They are
        `HttpOnly` and `__Host-`-prefixed, so the login UI's origin can neither
        read nor forge them.

        **The body is one of two shapes**, because the interaction is one
        operation with two steps: `{state, email, password}` on the first, and
        `{state, code}` on the second. Which one is expected is not in the request —
        it is in what the browser holds. A correct password for an account with a
        second factor answers `302` to the login UI with `step=challenge`, a fresh
        `state` and a challenge cookie, and the session cookie is NOT set. A
        correct code answers the `302` to the client below.

        `code` is a TOTP code or a recovery code in the same field, and neither
        refusal ever says which of the two a wrong value failed to be.

        A wrong password and an unregistered address are one `error` with one
        `error_detail`. This is the most attractive enumeration oracle on the
        platform — unauthenticated, takes an email, and the first thing anybody
        types into it is somebody else's address — so the two are indistinguishable
        in status, in query and in time.

        Every refusal that can be re-shown is a `302` back to the login UI rather
        than a status code, because the reader is a page on another origin and a
        problem document is not something it can render. A refusal with a fresh
        `state`, so the form it is about to be sent back to can be submitted again.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  description: |
                    The value from the redirect's query, checked against the
                    `__Host-` cookie sealed on this origin.

                    Re-minted on every step. A sealed value still in the cookie
                    after it has been spent is a CSRF token that works twice.
                email:
                  type: string
                  format: email
                  description: The password step only.
                password:
                  type: string
                  format: password
                  description: The password step only.
                code:
                  type: string
                  description: |
                    The second-factor step only. A six-digit TOTP code or a
                    recovery code. Never echoed back, never logged, and never
                    reflected into a refusal.
      responses:
        '302':
          description: |
            One of three things, told apart by the `Location`:

            * the client's `redirect_uri` with `code` and `state`, with the
              `__Host-session` cookie set in the same response — the flow
              completed;
            * the login UI with `step=challenge` and a fresh `state` — the password
              was right and the authentication is unfinished, which is the same
              thing the `POST /v1/session` 202 means;
            * the login UI with `error` and `error_detail` — a refusal, on whichever
              step it belongs to, with a fresh `state` so the form can be submitted
              again. `account_locked` also carries `retry_after`.
          headers:
            Location:
              schema: { type: string, format: uri }
        '400':
          description: |
            The body was not one this endpoint accepts. The one refusal on this
            operation that is a problem document rather than a redirect: identity
            and the browser do not agree on what was sent, so a redirect would be
            a page asking for a form a second time.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: |
            The authorization request is gone, so there is no step left to re-show
            and no `request_id` the login UI could post back. A `404` and not a
            redirect, for the same reason as on the GET.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: |
            This deployment cannot verify a second factor, because it has no
            `MFA_ENCRYPTION_KEY`. It fails closed and says why, in a problem
            document rather than a redirect, because a `503` is a statement about
            the server and there is nothing for the login UI to re-show.

            Unreachable in practice: with no key the enrolment routes are not
            mounted, so no account has a second factor and the challenge step is
            never entered. It is documented because the branch is real.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: |
            A server error, with a `trace_id`. A problem document for the same
            reason as the `503`: the reader of a server error is an operator with
            the log, and `trace_id` is what they need.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    clientBasic:
      type: http
      scheme: basic
      description: |
        The `client_id` and `client_secret` from the registration, as HTTP Basic
        credentials. Form-posted secrets are refused: a body gets logged.

        Every client in this service is confidential and holds a secret, so
        `token_endpoint_auth_methods_supported` is `["client_secret_basic"]` and
        not `["none", "client_secret_basic"]`. Advertising `none` would tell a
        client it may skip authenticating, which is true of a public client with
        PKCE and false of every client here.
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The access token from `POST /oidc/token`: an RS256 JWT signed with the key
        at `/.well-known/jwks.json`, carrying `iss`, `aud`, `sub`, `exp`, `iat`,
        `jti`, a space-delimited `scope`, and the `accounts` array on the
        `accounts` scope.

        Its `scope` claim carries the CAPABILITY scopes. `email` and `profile` are
        userinfo scopes and live in the ID token and at `/oidc/userinfo` instead —
        an address is not a capability, and core's conventions are explicit that
        scopes are for things like `invoices:write`.

  schemas:
    Discovery:
      type: object
      description: |
        OpenID Connect Discovery 1.0 §3 with RFC 8414's metadata merged in. The
        required members are `issuer`, `authorization_endpoint`, `token_endpoint`,
        `jwks_uri`, `response_types_supported`, `subject_types_supported` and
        `id_token_signing_alg_values_supported`.
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - userinfo_endpoint
        - jwks_uri
        - scopes_supported
        - response_types_supported
        - grant_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
        - token_endpoint_auth_methods_supported
        - code_challenge_methods_supported
        - claims_supported
      properties:
        issuer:
          type: string
          format: uri
          description: |
            Compared for equality against every token's `iss`. Configured as
            `OIDC_ISSUER`, and it must have no query, no fragment and no path.
        authorization_endpoint: { type: string, format: uri }
        token_endpoint: { type: string, format: uri }
        userinfo_endpoint: { type: string, format: uri }
        jwks_uri: { type: string, format: uri }
        scopes_supported:
          type: array
          items: { type: string }
          description: |
            Exactly `openid email profile accounts`. `phone`, `address` and
            `offline_access` are absent because this service has no column and no
            store for any of them, and advertising a scope is a promise to a
            product's rendering code.
        response_types_supported:
          type: array
          items: { type: string }
          description: The single value `code`. No implicit flow.
        grant_types_supported:
          type: array
          items: { type: string }
          description: '`["authorization_code"]`. No refresh token, no client credentials, no JWT profile.'
        subject_types_supported:
          type: array
          items: { type: string }
          description: '`["public"]`. The subject is the same for every client.'
        id_token_signing_alg_values_supported:
          type: array
          items: { type: string }
          description: '`["RS256"]`, matching the one published key.'
        token_endpoint_auth_methods_supported:
          type: array
          items: { type: string }
        code_challenge_methods_supported:
          type: array
          items: { type: string }
          description: '`["S256"]`. The token endpoint refuses anything else.'
        claims_supported:
          type: array
          items: { type: string }
          description: |
            Exactly the claims this service asserts. The OIDC defaults name
            `address`, `phone_number`, `picture`, `website`, `birthdate`,
            `gender`, `zoneinfo`, `locale`, `family_name`, `given_name` and
            `preferred_username`, and this service has no column for any of them.

    KeySet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          description: |
            Never empty. A consumer that fetches an empty set refuses every token
            it is shown, so the emptiness is the failure and it is worth
            asserting on.
          items:
            type: object
            required: [kty, kid, alg, use, n, e]
            properties:
              kty: { type: string, enum: [RSA] }
              kid:
                type: string
                description: |
                  The id this service signs under, and the one in the header of
                  every token it issues. It travels into a cache key and a log
                  line on every verifier in the platform, which is why it is
                  restricted to 1-64 characters of `A-Z a-z 0-9 . _ -`.
              alg: { type: string, enum: [RS256] }
              use: { type: string, enum: [sig] }
              n:
                type: string
                description: base64url of the modulus. Present, or every token fails to verify.
              e:
                type: string
                description: base64url of the public exponent.

    TokenResponse:
      type: object
      required: [access_token, id_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
          description: |
            An RS256 JWT. Presented as `Authorization: Bearer` at `/oidc/userinfo`,
            and verifiable locally by any cafaye service against the published key
            set — no round trip to this one.
        id_token:
          type: string
          description: |
            An RS256 JWT carrying `iss`, `aud` (the `client_id`), `sub`, `exp`,
            `iat`, `auth_time`, `amr`, `nonce` echoed from the request, and
            `at_hash` binding it to this access token. It also carries `email`,
            `email_verified` and `name` when those scopes were granted, so a
            product does not need a second round trip to learn a user's address.
        token_type: { type: string, enum: [Bearer] }
        expires_in:
          type: integer
          maximum: 900
          description: |
            Seconds, and at most 900. core's conventions cap access tokens at
            fifteen minutes and the column has a CHECK that says so, so this is a
            property of the table rather than of the code path that wrote the row.
        scope:
          type: string
          description: Space-delimited, the scopes actually granted.
        refresh_token:
          type: string
          description: |
            NOT IMPLEMENTED and never present. It is declared here only so that a
            generated client does not assume its absence is a bug in a deployment
            rather than a property of the provider.

    UserInfo:
      type: object
      required: [sub]
      properties:
        sub:
          type: string
          format: uuid
          description: The user. The same for every client — `subject_types_supported` is `public`.
        email: { type: string, format: email }
        email_verified:
          type: boolean
          description: |
            Always `false` today. This service has no email-verification column, so
            there is nothing here that could prove an address, and `true` would be
            a claim about something nobody has checked. The field is present and
            false rather than absent, because an absent `email_verified` is read as
            "assume verified" by a relying party that has to support providers
            which omit it.
        name:
          type: string
          description: |
            The personal account's name, derived from the email's local part. A
            stand-in, not a user-chosen name.
        accounts:
          type: array
          description: |
            The `accounts` scope. Every membership the user holds, with the role
            they hold it under.

            It is an array and not a single `account_id` because a user of a
            cafaye product is a member of a personal account and usually of several
            team accounts, and a token carrying one of them would be wrong for all
            the others. This is the multi-account form of the fact core's
            conventions ask for as `account_id`.
          items:
            type: object
            required: [account_id, name, slug, role, personal]
            properties:
              account_id: { type: string, format: uuid }
              name: { type: string }
              slug: { type: string }
              role:
                type: string
                enum: [owner, admin, member]
              personal:
                type: boolean
                description: Whether this is the account the registration created for the user.

    OAuthError:
      type: object
      description: |
        RFC 6749 §5.2. The error shape for every refusal on the protocol
        endpoints, and the only one a client library here will parse.
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - login_required
            - interaction_required
            - server_error
          description: |
            `invalid_grant` is the single-use and single-verifier answer:
            an unknown code, a spent code, an expired code, a wrong
            `code_verifier` and a mismatched `redirect_uri` are all it, so a
            caller learns nothing about which of the five it was.
        error_description:
          type: string
        error_uri:
          type: string
          format: uri

    Problem:
      type: object
      description: |
        The cafaye error envelope — RFC 9457 plus core's `code` and `trace_id` —
        used on this surface in exactly three places: the `/oidc/authorize`
        pre-checks, the refusals on `/oidc/login/{request_id}` that cannot be
        re-shown, and the 404 for an unknown request. All three are cafaye
        decisions rather than OAuth protocol responses, which is the distinction;
        everything else on these paths is RFC 6749.

        **A refusal a login UI could render is not one of them** — that is a
        `302` back to the login UI carrying `error` and `error_detail`, because
        the reader is a page on another origin and a problem document is not
        something it can render.

        The reason the split exists at all: an off-the-shelf OIDC client library
        pointed at this service must be able to parse every response it gets, and
        it cannot parse a problem document.
      required: [type, title, status, detail, instance, code, trace_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail:
          type: string
          description: |
            Names the offending parameter — "unknown scope \"phone\"", "PKCE is
            required", "prompt=login is not implemented". The person reading it is
            a developer configuring a product, and the specific sentence is the
            difference between a five-minute fix and an afternoon.
        instance: { type: string }
        code:
          type: string
          enum: [invalid_request, unauthorized, validation_failed, not_found, forbidden, internal]
        trace_id:
          type: string
          description: Always equal to the `X-Trace-Id` response header.
        errors:
          type: array
          description: Present only on a 422, listing per-field failures.
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }

# cafaye.yml — the cafaye project manifest for identity.
#
# The schema is owned by cafaye/core, not by this repository:
# ../core/schemas/cafaye.manifest.schema.json. This file satisfies it, and core
# asserts that agreement in both directions — a catalog row without a publisher
# entry, or a publisher entry without a catalog row, fails core's suite.
#
# HISTORY, because the shape changed and the reason is worth keeping.
#
# This file used to carry `version`, `languages[]`, `contracts[]` and `dev{}`,
# every one of them marked `# GUESS`. That draft is gone. AGENTS.md said the
# guessed fields were "a reconciliation list, not precedent — when core freezes
# the manifest, caf init regenerates the file and guessed fields are dropped, not
# migrated", and core has since frozen it: the schema above sets
# additionalProperties:false, so all four were violations rather than extensions.
# The information they carried is kept below as comments, because "identity is
# written in Go" is worth knowing and does not belong in the manifest.
#
# Validated with:
#
#   python -c "import json,yaml;from jsonschema import Draft202012Validator;\
#     print(list(Draft202012Validator(json.load(open('../core/schemas/cafaye.manifest.schema.json'))).iter_errors(yaml.safe_load(open('cafaye.yml')))))"

# The cafaye namespace name. Also the repository name, the Go module path, the
# event envelope's `source`, and the guard routing prefix. Changing it means
# changing all five.
name: identity

description: Authentication, sessions, MFA, OAuth, accounts and tenancy, scoped API tokens, and the OIDC provider.

# Implementation language. One binary, no other runtime dependency.
language: go

# The range of the core spec this service was written against. Service CI pins
# core to a release inside it.
core: ^0.1.0

exposes:
  # The repository-relative path to the OpenAPI 3.1 document describing the HTTP
  # surface. This is what `caf gen` generates SDKs from and what the contract
  # tests validate responses against.
  api: openapi/v1.yaml

  events:
    # Emitted by POST /v1/users, in the same transaction as the user row.
    #
    # THIS IS THE THREE-SEGMENT FORM, AS SPECIFIED BY THE PACKET FOR THIS
    # SERVICE — and core's catalog currently disagrees. core's
    # docs/event-naming.md spells this event `user.created` in two places: the
    # catalog row, and examples/valid/go-api.cafaye.yml. The same document's rule
    # 2 requires the service prefix only when the bare entity name is generic
    # (key, token, event, file, job, config, webhook, asset, secret); `user` is
    # not on that list.
    #
    # core records this as an open decision (D1) and names the three-segment form
    # as the alternative it is not currently using. This service follows the
    # packet, which specified it twice.
    #
    # The disagreement is one line here and one constant in
    # internal/outbox/envelope.go. A manager ruling the other way is a one-line
    # change — but it MUST be both lines at once, or the service will emit one
    # spelling and advertise the other, which is the only genuinely bad outcome
    # available here.
    - identity.user.created

    # The OIDC registrations. Emitted by POST /v1/accounts/{account_id}/oidc-clients
    # and DELETE on the same, each in the same transaction as the write it
    # describes — and the revocation transaction also bulk-revokes every access
    # token issued against the registration, because a JWT is verifiable by
    # anybody holding the published key set until its `exp` arrives and revoking
    # the registration is not by itself enough.
    #
    # The subject is the OIDC client's ROW id, not the account and not the
    # `client_id` string. A consumer that has to stop trusting a credential
    # correlates on the credential; a consumer watching an account's registrations
    # correlates on the account. Both questions are real and this event answers
    # the first, per core's "the entity the event is about, not the actor".
    #
    # CORE'S CATALOG HAS NO ROWS FOR EITHER TYPE YET. `caf contract lint` passes
    # — it checks the schema and the service-prefix rule, and both hold — but
    # core's tests/test_specs.py asserts a catalog row and a publisher entry agree
    # in BOTH directions, so core needs a row per type before that suite is green
    # against this manifest. That is a core change and this packet does not touch
    # another repository. It is the same reconciliation the two constants below
    # record, in the direction core has to move.
    - identity.oidc_client.created
    - identity.oidc_client.revoked
    # From the MFA packet. These two are core's catalog rows under these exact
    # names (docs/event-naming.md, "the user"), so unlike the tenancy ones there
    # is no divergence to record. The SUBJECT is the user, and for this pair that
    # is not a judgement call the way the tenancy events' is: a membership change
    # is about an account's member list, but a factor changing is about one person
    # and the device they carry.
    - identity.mfa.enabled
    - identity.mfa.disabled
    # The scoped API tokens. Emitted by POST /v1/accounts/{account_id}/api-keys
    # and DELETE on the same, each inside the transaction that wrote the row.
    #
    # BOTH ARE CORE'S CATALOG ROWS UNDER THESE EXACT NAMES
    # (docs/event-naming.md, "the api key"), so there is no divergence to record
    # here the way there is for the tenancy events. They are also the second piece
    # of evidence for the table being named `api_keys` rather than `api_tokens`:
    # the published vocabulary is the one thing in the schema another repository
    # has already committed to.
    #
    # The subject is the credential's own row id. A consumer that has to stop
    # trusting a credential correlates on the credential; a consumer auditing an
    # account's credentials correlates on data.account_id, which is in every
    # payload for exactly that reason.
    #
    # `identity.api_key.revoked` is ALSO THE EVENT FOR AN EXPIRY, which is core's
    # own wording for the row ("A scoped API token is revoked or expired"). This
    # service has no sweeper, so nothing emits that second case yet — see
    # README.md, "Not built yet".
    - identity.api_key.created
    - identity.api_key.revoked

    # Not yet emitted, and deliberately absent rather than declared and unimplemented:
    #   user.email_verified   the email-verification packet
    #   account.created       the accounts and tenancy packet
    #   member.invited        the accounts and tenancy packet
    #   member.joined         the accounts and tenancy packet
    #   member.removed        the accounts and tenancy packet
    #   member.role_changed   the accounts and tenancy packet
    #   session.revoked       a later packet; DELETE /v1/session does not emit it yet
    #
    # Also absent, and the omission is deliberate rather than pending: the OIDC and
    # MFA packets land in THIS file's `events` list above rather than in this
    # comment, because the code emits them.
    #
    # core asserts that a catalog row and a publisher entry are the same fact
    # stated twice, so declaring one of these before the code emits it would fail
    # core's suite in the other direction.
    #
    # consumes: none. identity is a leaf — it depends on no other cafaye service.
    # dependencies: none, for the same reason. Both keys are omitted rather than
    # left as empty lists; an empty list says "we checked and there are none",
    # which is true today but is a claim that has to be revisited.

repository:
  # SSH only. An HTTPS remote for a cafaye repo is a policy violation (PLAN.md §1).
  url: git@github.com:cafaye/identity.git
  defaultBranch: master
  visibility: public

owner:
  team: identity
  contact: identity@cafaye.com

# ---------------------------------------------------------------------------
# Dropped from the previous draft, with the information kept here:
#
#   version: 1
#       Not in the schema. core tracks spec versions through `core:` and through
#       git; a second version number in this file is a footgun core's own
#       versioning note calls out.
#
#   languages: [{name: go, version: "1.26"}]
#       Folded into `language: go`. The Go version lives in exactly one place
#       now — the `go` directive in go.mod — plus the lint floor and the mise
#       pin. It used to be stated here as well, which is three places to keep in
#       sync for a number that does not belong in a contract manifest.
#
#   contracts: []
#       Became `exposes.api`. An empty list said "identity has no contract
#       surface", which stopped being true the moment openapi/v1.yaml landed.
#
#   dev: {services: []}
#       Belongs to docker-compose.yml, which is the declared local stack, and to
#       `caf dev`. It is not part of the service's published contract, and a
#       manifest that described the dev stack would be a manifest that churns
#       every time somebody adds a container.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# DECISION NEEDED — the scope claim has two names in the fleet, and this service
# publishes both.
#
# Recorded here rather than only in a changelog because `cafaye.yml` is the file a
# consumer and a reviewer both read, and because a client integrating against
# POST /v1/introspections needs to know that one of the two names is going away.
#
# WHAT DISAGREES, verified against the code rather than a reading of it:
#
#   core/docs/openapi-conventions.md:134 requires a claim named `scopes`.
#   guard/src/middleware/jwt.ts:32 reads `scope`, splits it on whitespace, and
#   treats an absent claim as an empty set.
#
# The question is open as MD7 in the manager's DECISIONS.md. It has been recorded
# twice before, by `guard-02` and by `cafaye-rb-01`, and answered neither time.
# This service does NOT pick a side.
#
# WHAT IT DOES INSTEAD: POST /v1/introspections emits the capability set twice —
# as `scopes` and as `scope`, byte for byte identical, both space-separated
# strings — so that whichever name wins, no credential already in a customer's hand
# stops working and the flip is a one-line removal from internal/apikeys/claims.go
# rather than a rotation. internal/apikeys/claims_test.go holds the two together
# in a struct and internal/httpapi/introspection_test.go holds them together on the
# wire, which is the only place a consumer sees them.
#
# THE SHAPE IS A STRING, NOT AN ARRAY, and that is not a third opinion: it is the
# one shape both sides can read. guard's verifier does `raw.split(/\s+/)` and
# REFUSES a non-string claim, so an array is a token the gateway will not parse at
# all, and core's own example is a capability string.
#
# TWO NAMES IS NOT A CONTRACT. It is the cost of not rotating credentials over an
# unanswered question, and it is a deliberate interim rather than an oversight.
#
# RELATED AND NOT DECIDED HERE: core requires `account_id` and guard treats it as
# optional with a fallback to `sub`. That is a separate and more serious question
# (proposed as MD8) and this packet does not rule on it. What it does is never
# produce a token that needs the fallback: an api key's claim document always
# carries `account_id`, and one with no account is answered `{"active": false}`
# rather than being issued a subject to guess a tenancy key from.
# ---------------------------------------------------------------------------

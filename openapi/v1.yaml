# openapi/v1.yaml — the HTTP contract for identity's v1 surface.
#
# This file is what `exposes.api` in cafaye.yml points at, and it is written to
# cafaye/core docs/openapi-conventions.md. Where core and this file disagree, core
# is right and this file is the bug.
#
# Three places this document knowingly departs from core, all of them a manager
# decision rather than a local choice. They are listed under "Known gaps" at the
# bottom and repeated inline where they apply, so neither is easy to miss.
openapi: 3.1.0

info:
  title: cafaye identity
  # Bumped for the OIDC registration routes, again for the multi-factor routes, and
  # again for the scoped API tokens. No path prefix moved and no existing response
  # shape changed, so core's sync rule asks for exactly this: a non-breaking change
  # bumps only the document version.
  #
  # The 202 on POST /v1/session is the exception worth reading twice. It is a new
  # response on an existing operation, and an existing 200 client is unaffected by
  # it because 200 is still what an account with no second factor gets. A client
  # that only accepts 200 is broken the moment a user enrolls, which is precisely
  # the moment the client has to change.
  #
  # The scoped API tokens are additive in the same sense: four new operations, a
  # second credential accepted by `bearerToken`, and one behaviour change on an
  # EXISTING operation — `DELETE /v1/session` now answers 403 to a scoped token
  # where it used to answer 204. A client that only ever presents session tokens
  # cannot tell, and a client that had started pasting a `cafaye_` token into its
  # logout call was being told a revocation had happened when none had.
  #
  # 1.4.0 is the admin surface: three new operations, all under a new `admin` tag,
  # none of them changing an existing operation. It is additive for a second
  # reason as well, which is worth stating because a client reading only the
  # version would not see it: **the admin surface is token-only**, so `security`
  # on these three operations lists `bearerToken` and NOT `sessionCookie`. That is
  # a new kind of route in this document rather than a new route, and a client
  # generating from it will get three methods that take no session where every
  # other account route takes either.
  #
  # 1.5.0 is the recovery surface: eight new operations under a new `recovery`
  # tag, and — unlike every bump before it — **one behaviour change on an existing
  # surface**, which is stated here rather than left to be discovered:
  # `DELETE /v1/session` and the other session-scoped operations are unaffected,
  # but a client that renders "sign out" after a password change or an email change
  # has to clear its own local state, because this service revokes every session
  # the account held and mints nothing back. No response shape on an existing
  # operation changed, and no path moved.
  #
  # Two properties of these eight operations are contract, not description, and a
  # generated client inherits both: the three anonymous confirmation routes take a
  # token where `security` is `[]` (the token IS the credential), and the two
  # request routes return a `Accepted` body with exactly one field, ever.
  version: 1.5.0
  summary: Authentication, sessions, multi-factor authentication, account recovery, accounts, tenancy, scoped API tokens, the admin surface and OIDC registrations.
  description: |
    `identity` is the cafaye platform's security boundary: it is what every other
    service asks to identify a caller.

    ## Two credential surfaces

    A successful `POST /v1/session` hands back the same session token twice.

    * As a `__Host-session` cookie, for a browser. The cookie is `Secure`,
      `HttpOnly`, `SameSite=Lax` and `Path=/`, with no `Domain`. The `__Host-`
      prefix is a browser-enforced contract: such a cookie is accepted only under
      those conditions, which is what stops a sibling or subdomain origin from
      setting or overwriting it.
    * As a `token` field in the response body, for an API client. A cookie is a
      browser mechanism; a server-side client cannot use one, and core's
      conventions say as much ("No cookies for API traffic").

    Both name the same session. `DELETE /v1/session` revokes it for both surfaces
    at once, and the token stops working immediately on both.

    `GET /v1/me` accepts either. An `Authorization: Bearer` header is preferred
    over the cookie when both are present, because a client holding both has said
    which one it means.

    ## An account with a second factor gets a 202 and no session

    `POST /v1/session` has a second success shape. When the password is correct
    and the account has a confirmed second factor, the response is **202** with a
    challenge and **no session at all** — no `token` field, and no session cookie.
    The challenge authenticates nothing until it is presented with a code at
    `POST /v1/session/mfa`, which is where the session is minted.

    There is no way to get a session out of this service without answering a
    second factor on an account that has one. That is enforced in the use case,
    not in a middleware, so no route, no error path and no future handler can
    arrange around it.

    A `200` is still what an account with no second factor gets, and the two are
    told apart by the status code rather than by a field: a client that only
    accepts 200 is broken the moment a user enrolls, which is the moment it has to
    change anyway.

    ## Errors

    Every non-2xx response is `application/problem+json` (RFC 9457) with core's
    `code` and `trace_id` extensions, and no exceptions. `trace_id` is always
    present and always equal to the `X-Trace-Id` response header; support starts
    from that id. `errors[]` appears only on 422 and lists per-field failures.

    Login never distinguishes a wrong password from an unregistered address. Both
    are 401 with the same body. A 423 is the one place login reveals that an
    account exists, and it does so only because the caller has just demonstrated
    knowledge of a working password's absence five times over.

    ## Request size

    Request bodies are capped at 4096 bytes. A registration is an email and a
    password; nothing legitimate approaches that, and the cap is what stops an
    unauthenticated caller choosing how much this service parses per request.

    ## The OpenID Connect provider is a different document

    This service is also an OpenID Connect provider, and its protocol surface is
    NOT here. The discovery document, the JWKS, the authorization, token and
    userinfo endpoints, and the login page are all on paths the specifications
    fix — `/.well-known/openid-configuration`, `/oidc/authorize` and so on — and
    core's conventions put every path in this document under `/v1`. A document
    that contained both would break one of the two rules.

    The provider's contract is `openid/openid.yaml`, and it is a separate file
    for the same reason the error envelope differs there: an off-the-shelf OIDC
    client library cannot parse a problem document, and core's `/v1` rule cannot
    be satisfied by a path RFC 8414 chooses. What IS in this document is the
    cafaye API for managing the registrations that provider accepts:
    `/v1/accounts/{account_id}/oidc-clients`.

    ## Two authorization decisions worth knowing before reading the matrix

    A non-member of an account gets **404**, never 403, on every account-scoped
    route including the OIDC ones. A 403 would confirm that the account id they
    guessed is a real account, which is a free tenant-enumeration oracle on a
    table whose ids are the only thing standing between one customer and
    another.

    Registering, reading and revoking an OIDC client are **owner-only**. Adding a
    client is adding a new way for code to arrive in a product and get a token
    back out, and "can read the member list" is not authority to widen the
    perimeter. `identity` has no platform-admin role yet — the admin API is a
    later packet — so the owner role is the one privilege this service already
    has that means "may change what can enter this account".

    ## Scoped API tokens are a third credential, not a flag on either of the others

    A **session** is browser-shaped and short-lived. An **OIDC access token** is a
    JWT for a third party holding a browser, verified against a published JWKS
    with no call back to here. A **scoped API token** is a first-party machine
    credential: opaque, long-lived, revocable, and carrying a scope set.

    Three of them because the three have genuinely different failure modes, and
    running one through another's machinery would give each of them the wrong
    one. A session that cannot be revoked instantly is a stolen browser; a JWT
    that cannot be revoked before its `exp` is a fifteen-minute window and
    nothing more; an opaque token that could not be revoked at all would be a
    permanent credential, which is the one shape this service does not offer.

    The property worth reading twice: **a token carries a scope set, not a role.**
    Its authority is re-evaluated on every request against the owner's *current*
    membership, so removing somebody from an account stops their tokens on the
    next request — and a re-invitation does not bring them back, because the
    removal also revoked what they held. That is the difference between a
    credential and a permission, and it is why there is no `role` to edit on a
    token.
  contact:
    name: identity
    url: https://github.com/cafaye/identity
    email: identity@cafaye.com
  license:
    name: MIT
    url: https://opensource.org/license/mit

servers:
  - url: https://identity.cafaye.com
    description: production
  - url: http://localhost:8080
    description: local development (docker compose up)

tags:
  - name: users
    description: Registration. Creating the credential is the only way to obtain one.
  - name: sessions
    description: Logging in, resolving a session, and revoking it.
  - name: mfa
    description: |
      The second factor: TOTP enrollment, the login's second step, recovery codes,
      and turning it off.

      Absent entirely when `MFA_ENCRYPTION_KEY` is not configured. The management
      routes are not mounted in that deployment, and the login's second step IS,
      so a user who enrolled elsewhere is refused rather than let in on their
      password. The absence of these routes says nothing about whether a second
      factor is still required — `POST /v1/session/mfa` rides on the sessions
      surface and answers 503 when it cannot verify a code.
  - name: oidc-clients
    description: |
      OpenID Connect client registrations: the credentials products present at
      the token endpoint. The protocol surface itself is in `openid/openid.yaml`.
  - name: api-keys
    description: |
      Scoped API tokens: the credential that is not a browser session, for a
      script, a CI job or another service. Opaque, named, scoped, revocable, and
      expiring — and **not** interchangeable with a session or with an OIDC access
      token, which is why it is its own surface and not a flag on either of them.

      A token carries a scope set, not a role. Its authority is re-evaluated on
      every request from the owner's **current** membership, so removing somebody
      from an account stops their tokens immediately, and a re-invitation does not
      bring them back.
  - name: admin
    description: |
      The admin surface: revoking pending invitations, and the immutable audit
      trail recording that somebody did.

      **Reachable by a scoped API token only — never by a browser session.** A
      session is a browser credential, and an admin surface a session cookie opens
      is an admin surface one CSRF away from being somebody else's. A token is the
      right credential here for a second reason as well: every action on this
      surface is recorded against the **api key's row id**, so a machine
      credential is something an audit record can name and a session is not.

      The privilege boundary, in one sentence: *an account admin may revoke pending
      invitations to their own account and read that account's admin audit log —
      authority over other people's pending access, and nothing else.*

      A bulk revocation requires a `confirm` field and a named array, and a single
      revocation requires neither. The difference is in the request shape, not in a
      dialog, because a dialog is not something an API client has.
  - name: recovery
    description: |
      The three flows a person can only finish by proving they can read an inbox:
      resetting a password, verifying the account's address, and moving the account
      to a new address.

      They are one tag because they are one machine. Each mints a 256-bit random
      value, stores nothing but its SHA-256, mails it, and spends it with a
      conditional write that makes a second presentation a refusal — and a client
      integrating one of them is integrating the other two's token lifecycle.

      **Every route here refuses a scoped API token.** A credential that could
      start an email change is a credential that can move an account's recovery
      path, and a credential that could mint a password reset is a takeover with a
      delay rather than a break-in. There is no scope in the machine vocabulary
      for either, and there is not going to be one.

      A reset token and a verification token are credentials, and the routes that
      redeem them are anonymous: the token IS the authentication. They are 404 for
      everything that is not a live token, including an expired one, a spent one,
      and one minted for a different flow.

      Absent entirely when `DATABASE_URL` is not configured, like every other
      surface here. Mounted — and answering 503 on the paths that need to send —
      when there is no mail delivery path, because a 404 would tell a product this
      service has never heard of password recovery.
  - name: probes
    description: Liveness and readiness. Consumed by orchestrators, not by clients.

paths:
  /v1/users:
    post:
      tags: [users]
      operationId: registerUser
      summary: Register an account
      description: |
        Creates a user and, in the same database transaction, records an
        `identity.user.created` event. Either both exist or neither does: a user
        that exists without its event would never be announced, and an event
        without its user would announce a registration that did not happen.

        Does not create a session. Sign in separately with `POST /v1/session`.

        This is the only endpoint that reveals whether an address is already
        registered, and it answers 409. Everywhere else, "no such account" and
        "wrong password" are indistinguishable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                summary: a new registration
                value:
                  email: kaka@example.com
                  password: correct horse battery staple
      responses:
        '201':
          description: The account was created.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  value:
                    id: ab000000-0000-0000-0000-000000000000
                    email: kaka@example.com
        '400':
          $ref: '#/components/responses/MalformedBody'
        '409':
          description: An account already exists for that address.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Retry-After:
              description: Always absent on a 409. Present only on a 423.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                conflict:
                  summary: the address is taken
                  value:
                    type: https://errors.cafaye.com/conflict
                    title: Conflict
                    status: 409
                    detail: an account already exists for that email address
                    instance: /v1/users
                    code: conflict
                    trace_id: 0af7651916cd43dd8448eb211c80319c
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/session:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Log in
      description: |
        Verifies an email and password and starts a session.

        Five consecutive wrong passwords for one address lock that account for
        fifteen minutes. A locked account is refused with 423 and a `Retry-After`
        header before the password is checked at all, so it cannot be probed; the
        rejected attempt does not extend the window. A successful login clears the
        count.

        An unknown address and a wrong password produce the same 401 body and take
        comparable time: the unknown-address path performs the same argon2id
        verification against a digest nothing can match. This is deliberate and is
        the reason a login endpoint does not enumerate accounts.

        Login does not accept an `Idempotency-Key`. A login is not safely
        repeatable — retrying it mints another session rather than returning the
        first one — so honouring the header would be a lie. See "Known gaps".

        **AN ACCOUNT WITH A SECOND FACTOR GETS 202 AND NO SESSION.** The password
        is correct and the authentication is not finished, which is what 202
        means. The `202` body carries **no `token` key at all** — not an empty
        one — so a client that reads `token` finds nothing and is unambiguous
        about it. The `challenge` in that body is the token for
        `POST /v1/session/mfa`, and it authenticates nothing until a code is
        presented against it.

        Five consecutive wrong CODES lock the second factor for fifteen minutes,
        with `423` and `Retry-After`, and that counter is **separate from the
        password's**: five TOTP guesses have not spent five password guesses, and
        five wrong passwords have not moved the second factor's.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  email: kaka@example.com
                  password: correct horse battery staple
      responses:
        '200':
          description: |
            The credentials were correct and a session now exists. The same token
            is in the body and in the cookie.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              description: The `__Host-session` cookie, or absent for a client that ignores cookies.
              schema:
                type: string
              example: '__Host-session=…; Path=/; Secure; HttpOnly; SameSite=Lax'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                default:
                  value:
                    token: 0dN3aQ2vF8kLmXpR7sT1uWzYb4cE6hJ9gK2mP5rS8tV
                    expires_at: '2026-10-30T12:00:00Z'
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          description: |
            The credentials were refused. The body is identical whether the
            address is unregistered or the password is wrong, and says nothing
            about which.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                refused:
                  value:
                    type: https://errors.cafaye.com/unauthorized
                    title: Unauthorized
                    status: 401
                    detail: authentication is required to access this resource
                    instance: /v1/session
                    code: unauthorized
                    trace_id: 0af7651916cd43dd8448eb211c80319c
        '202':
          description: |
            The password was correct and this account has a second factor. **No
            session exists** and no session cookie is set.

            The `challenge` is a one-time credential for `POST /v1/session/mfa`,
            valid for ten minutes and single-use. It is also set as the
            `__Host-mfa-challenge` cookie, which is the browser's copy and carries
            the same value.

            There is no `token` field in this schema, and that is deliberate: a
            client that looks for one must handle its absence rather than treat an
            empty string as a value.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              description: The `__Host-mfa-challenge` cookie. No `__Host-session` cookie is set.
              schema:
                type: string
              example: '__Host-mfa-challenge=...; Path=/; Secure; HttpOnly; SameSite=Lax'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAChallenge'
              examples:
                default:
                  value:
                    mfa_required: true
                    challenge: 1M3g7KhUlTycennyoeYRSwdey3Erdn2BfafBYTXpqxY
                    expires_at: '2026-09-30T12:10:00Z'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          description: |
            The account is locked after too many consecutive failures. The
            `Retry-After` header and the `detail` both carry the remaining window
            in whole seconds, rounded up.

            The window is deliberately **not** an entry in `errors[]`: core scopes
            that array to 422 and to fields of the request, and `retry_after` is
            not one.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Retry-After:
              description: Seconds until the account may be tried again. Never negative.
              required: true
              schema:
                type: integer
                minimum: 0
              example: '900'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                locked:
                  value:
                    type: https://errors.cafaye.com/account_locked
                    title: Account locked
                    status: 423
                    detail: too many failed sign-in attempts for this account; retry after 900 seconds
                    instance: /v1/session
                    code: account_locked
                    trace_id: 0af7651916cd43dd8448eb211c80319c
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [sessions]
      operationId: deleteSession
      summary: Log out
      description: |
        Revokes the session the presented credential names, and clears the
        session cookie. The token stops working on both surfaces immediately: a
        `GET /v1/me` with the revoked token is a 401 on the cookie and on the
        bearer header alike.

        Other sessions for the same account are unaffected. "Sign out everywhere"
        is a different operation and is not in this packet.

        A token that resolves to nothing is a 401, and the cookie is cleared
        anyway. A stale cookie is the common case — the session expired hours ago
        and the browser kept it — and leaving it in place means the user clicks
        "sign out" again and nothing appears to happen.
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '204':
          description: The session was revoked and the cookie cleared.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              description: An expired `__Host-session` cookie, with the same attributes that set it.
              schema:
                type: string
              example: '__Host-session=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0'
        '401':
          description: No usable credential, or one that no longer resolves.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/session/mfa:
    post:
      tags: [mfa]
      operationId: completeSecondFactor
      summary: Answer a second factor and start the session
      description: |
        The second half of a login for an account with a second factor, and **the
        only route in this service that turns a second factor into a session**.

        The session is created inside the same transaction that consumes the
        challenge, so a challenge cannot be answered twice and a code cannot buy two
        sessions.

        **The challenge is accepted in the cookie or in the body**, and both are
        supported on purpose: cafaye's conventions say "no cookies for API traffic",
        and `POST /v1/session` returns the session token in the body as well as in
        the cookie precisely so a non-browser client has a way in. The explicit body
        value wins when both are present, for the reason `GET /v1/me` prefers the
        `Authorization` header over the cookie.

        A code is accepted within **one step either side** of the current one, so a
        TOTP code is live for 90 seconds rather than 30. Zero skew would refuse any
        code typed near a step boundary, which is when a user is most likely to be
        reading digits off a screen, and a second factor with a visible failure rate
        gets turned off rather than retried. Two steps or more would be ninety more
        seconds during which a phished code still works.

        **A code cannot be accepted twice.** Replay is the standard attack against
        TOTP, and this service records the exact steps consumed: a code already used
        is refused for the whole window, and refusing it costs nothing to the user
        beyond the next 30-second period.

        Five consecutive wrong codes lock the second factor for fifteen minutes, and
        that counter is **separate from the password's**.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSecondFactorRequest'
            examples:
              totp:
                value:
                  challenge: 0aO1B_UdLdgx40iTjWfNXQR0naZbS9BiM-4f50PkXR0
                  code: '482913'
              recovery:
                value:
                  challenge: 0aO1B_UdLdgx40iTjWfNXQR0naZbS9BiM-4f50PkXR0
                  code: 7KQF-4W2X-5DTR-M3HN
      responses:
        '200':
          description: |
            The second factor was accepted and a session now exists. The same token
            is in the body and in the cookie, and the challenge cookie is cleared.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              description: The `__Host-session` cookie, and the `__Host-mfa-challenge` cookie cleared.
              schema:
                type: string
              example: '__Host-session=...; Path=/; Secure; HttpOnly; SameSite=Lax'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          description: |
            The factor was refused, or no challenge was presented. The body is the
            same for a wrong code, a recovery code that was already spent, a TOTP
            code whose step has been used, and a value that is neither shape: five
            different facts, and an attacker who can tell them apart learns which to
            keep trying.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          description: |
            The second factor is locked after too many consecutive failures. The
            `Retry-After` header carries the remaining window in whole seconds.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Retry-After:
              description: Seconds until the second factor may be tried again.
              required: true
              schema:
                type: integer
                minimum: 0
              example: '900'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: |
            This deployment cannot verify a second factor, because
            `MFA_ENCRYPTION_KEY` is not configured. It is a 503 and not a 404 on
            purpose: a 404 would say the service has never heard of MFA, and a
            client that believed that would be free to treat the absence of a
            challenge as the absence of a requirement.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/mfa:
    get:
      tags: [mfa]
      operationId: getMFAStatus
      summary: Whether the caller has a second factor
      description: |
        Returns whether this account has a confirmed second factor, when it was
        enrolled, and how many recovery codes are left.

        `recovery_codes_remaining` is here so a client can say "2 left — print a new
        set" while there are still two. A user with zero recovery codes and a lost
        phone is a support ticket, and the honest thing is to say so beforehand.

        A `200` with `{"enabled": false}` and **not** a 404 when there is no
        credential: the question has an answer for every signed-in user, and a
        settings page should not have to distinguish "you have none" from "this is
        not your account".
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '200':
          description: The caller's second-factor status.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAStatus'
              examples:
                enabled:
                  value:
                    enabled: true
                    method: totp
                    enrolled_at: '2026-09-30T12:04:11Z'
                    recovery_codes_remaining: 8
                notEnabled:
                  value:
                    enabled: false
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [mfa]
      operationId: disableMFA
      summary: Turn the second factor off
      description: |
        Requires a second factor, and a password is **not** accepted: there is no
        route to this operation without one. Re-authentication for a destructive
        security action is the whole reason it exists, and a user whose phone is
        elsewhere must use a recovery code — which is why recovery codes exist.

        Revokes **every session the user holds**, and emits `identity.mfa.disabled`.
        A user who turns MFA off has very often had it turned off *for* them, and
        every session in existence was minted under a two-factor policy.

        The caller's own session is revoked by this call, so a browser is left
        signed out. That is the honest outcome rather than an exception.
      security:
        - sessionCookie: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorRequest'
            examples:
              totp:
                value:
                  code: '482913'
              recovery:
                value:
                  code: 7KQF-4W2X-5DTR-M3HN
      responses:
        '204':
          description: MFA is off, every session is revoked, and the cookie is cleared.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              description: The `__Host-session` cookie, cleared.
              schema:
                type: string
              example: '__Host-session=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0'
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: |
            This account has no second factor, so there was nothing to turn off.
            A 409 rather than a 404: the caller is asking to change something that
            does not exist, which is a different question from "is this yours".
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          description: The second factor is locked after too many consecutive failures.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Retry-After:
              description: Seconds until the second factor may be tried again.
              required: true
              schema:
                type: integer
                minimum: 0
              example: '900'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/mfa/enrollments:
    post:
      tags: [mfa]
      operationId: startMFAEnrollment
      summary: Generate a TOTP secret
      description: |
        Generates a secret with `crypto/rand`, stores it **unconfirmed**, and returns
        it once with its `otpauth://` provisioning URI.

        `secret` and `provisioning_uri` are returned here and **never again**: there
        is no endpoint that re-reads them, so a client that loses this response
        starts a new enrollment, which mints a new secret. The reasoning is the one
        an OIDC `client_secret` follows: a secret this service can produce again is a
        secret this service is storing, and a stored TOTP secret is a second factor
        for whoever reads the database.

        **A pending enrollment is not MFA.** It expires in ten minutes, the login
        path reads only confirmed rows, and no session is issued until
        `/confirm`. A stored-but-never-confirmed secret is exactly the state that
        locks somebody out of their own account.

        On an account that **already** has a credential this starts a **rotation**,
        and `code` is then required. The existing secret stays live until the
        replacement is confirmed, so an abandoned rotation costs nothing; on
        confirmation the old credential is deleted, which is how its codes stop being
        accepted.
      security:
        - sessionCookie: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartEnrollmentRequest'
      responses:
        '201':
          description: A pending enrollment, and its one-time values.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartedEnrollment'
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          description: The second factor is locked, so a rotation cannot be authorised.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Retry-After:
              description: Seconds until the second factor may be tried again.
              required: true
              schema:
                type: integer
                minimum: 0
              example: '900'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/mfa/enrollments/{enrollmentId}/confirm:
    post:
      tags: [mfa]
      operationId: confirmMFAEnrollment
      summary: Prove you can produce a code, and make MFA live
      description: |
        Verifies a code against the pending secret and, on success, makes MFA live in
        one transaction: confirm the pending row, delete the credential it replaced
        if any, write ten recovery codes, revoke every session the user holds, and
        announce `identity.mfa.enabled`.

        **Every session is revoked, including the caller's own.** A session minted
        under a one-factor policy was minted on a password alone, and leaving it
        alive means the attacker holding it does not have to solve the new problem.

        The recovery codes are returned here and **never again** — no endpoint
        re-reads them and no column stores them, only a SHA-256 digest per code.
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: |
            The pending enrollment's own id. Another user's, an expired one's, and
            one that has already been confirmed are all `404`, so the id is not a
            way to learn which enrollments exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEnrollmentRequest'
      responses:
        '200':
          description: MFA is live, and the recovery codes are returned once.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmedEnrollment'
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          description: |
            The code was refused. One sentence for every way it can fail: wrong,
            already spent, malformed, or produced by a secret this rotation has
            already replaced.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/mfa/recovery-codes:
    post:
      tags: [mfa]
      operationId: regenerateMFARecoveryCodes
      summary: Issue a new set of recovery codes
      description: |
        Deletes the old set and writes the new one **in one transaction**, and
        requires a second factor: handing out ten fresh codes is handing out ten
        fresh ways into the account.

        The atomicity is the requirement. A partial write leaves a user with two
        live sets, which is a second recovery path through codes nobody audited and
        nobody will ever see in a log.
      security:
        - sessionCookie: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactorRequest'
      responses:
        '200':
          description: A new set, returned once, and the count that replaced the old one.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResponse'
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          description: |
            The factor was refused, or this account has no second factor.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: This account has no second factor, so there are no codes to replace.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          description: The second factor is locked after too many consecutive failures.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Retry-After:
              description: Seconds until the second factor may be tried again.
              required: true
              schema:
                type: integer
                minimum: 0
              example: '900'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/me:
    get:
      tags: [sessions]
      operationId: getCurrentUser
      summary: The authenticated user
      description: |
        Resolves the presented credential and returns the account it belongs to.

        A cookie and a bearer token are both accepted. When both are present the
        `Authorization` header wins: a client holding both has said which it means,
        and answering from the cookie would make the result depend on invisible
        browser state.

        A missing, unknown, expired or revoked token are one 401 with one body. So
        is a token whose account has been deleted.
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '200':
          description: The authenticated user.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  value:
                    id: ab000000-0000-0000-0000-000000000000
                    email: kaka@example.com
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/password-resets:
    post:
      tags: [recovery]
      operationId: requestPasswordReset
      summary: Ask for a password-reset link
      description: |
        Mails a single-use link to the account's registered address, valid for 30
        minutes.

        **The response is the same for every address, and the body is a constant.**
        A registered address, an unregistered one and an address inside the
        one-minute cooldown all get `202 {"status":"accepted"}` with identical
        bytes. This is the entire account-enumeration defence on this route, and it
        is why `acceptedResponse` in the handler is a constant rather than a template
        with a field that happens to render the same either way: a field is a field,
        and the next person to add an `expires_at` to it reinstates the oracle
        without touching a test.

        The status is 202, not 200 and not 204. The request *was* accepted for
        processing; whether the message is delivered is not something the caller is
        entitled to learn before they have proved which account they are asking
        about.

        **A second request inside the cooldown sends nothing at all**, and answers
        identically. It does not supersede the first link: a request route that
        invalidated a live token would let anybody invalidate a victim's pending
        reset, which is a denial of recovery dressed up as a convenience.

        A cooldown is not a rate limiter, and this service does not have one here.
        It bounds mail to one message per address per minute, which stops the
        obvious abuse of an anonymous endpoint pointed at one victim. It does
        nothing about a flood spread across a thousand addresses and is not
        per-client. Per-source throttling belongs to courier, which is in the path
        of every message this service sends.

        Resetting revokes **sessions and OIDC access tokens** when the link is
        redeemed, and **not** scoped API keys — the same rule the second-factor
        removal already follows, and the reason is the same.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryEmailRequest'
            examples:
              default:
                summary: ask for a link
                value:
                  email: kaka@example.com
      responses:
        '202':
          description: Accepted. Identical for every address.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/MalformedBody'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/MailUnavailable'

  /v1/password-resets/confirm:
    post:
      tags: [recovery]
      operationId: confirmPasswordReset
      summary: Spend a reset link and set a new password
      description: |
        Changes the password and revokes every session and every live OIDC access
        token the account holds, in one transaction.

        The revocation is why this is 204 and not a 200 with a session in it: the
        caller's own session is revoked by the same write that changes the
        password, so a caller that was signed in when it started is signed out when
        it finishes and cannot use this route to keep itself signed in. **No session
        is minted** — that would be a second way to turn a mailbox into a
        credential without answering a second factor. Sign in again with the new
        password.

        The session cookie is cleared on the response as well as the row revoked, so
        a browser is not left holding a credential this request just killed.

        **404 for everything that is not a live token**: one that never existed, one
        that expired, one already spent, and one minted for a different flow. It is
        404 and not 401 because the caller is not asking who they are — they are
        following a link, and "there is no such link" is also what they learn about
        every link they did not receive.

        Scoped API keys survive. This is the same rule `DELETE /v1/mfa` already
        follows and the same reason: a key is a credential somebody deliberately
        created and handed to a script, and a person who forgot their password is
        not necessarily the person who owns it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPasswordResetRequest'
            examples:
              default:
                summary: redeem the link
                value:
                  token: 0Kq3Zs1oQw7bXn0K9dLpR2vT4yE6hJ8cF1gM5nA2qU0
                  password: a completely new password
      responses:
        '204':
          description: |
            The password changed and every session and access token was revoked.
            No body.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookie'
        '400':
          $ref: '#/components/responses/MalformedBody'
        '404':
          description: No live token matches — it never existed, expired, was spent, or belongs to another flow.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://errors.cafaye.com/not_found
                title: Not found
                status: 404
                detail: no such link, or it has already been used
                instance: /v1/password-resets/confirm
                code: not_found
                trace_id: 0af7651916cd43dd8448eb211c80319c
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/email-verifications:
    post:
      tags: [recovery]
      operationId: requestEmailVerification
      summary: Ask for a link that proves the account's address
      description: |
        Mails a link to the account's registered address, valid for 24 hours.

        **The address is the one on the account, never one the request supplies.**
        There is no `email` in the body that means "verify this address" — the body
        carries the address to look the account up by, and what gets proved is the
        address already stored on the row. A token that verified whatever address the
        request carried would be a registration of somebody else's inbox.

        Verification is not automatic at registration. `POST /v1/users` does not
        send anything, and a client that wants an address proved calls this route
        afterwards. That is one extra call in exchange for a registration that
        cannot fail because a mail provider is down.

        Same answer for every address, same constant body, same 202, and the same
        one-minute cooldown that sends nothing rather than superseding a live link —
        for the reasons on `requestPasswordReset`, which this route mirrors.

        409 if the account's address is **already** verified. It is a 409 rather
        than a silent 202 because a client rendering "check your inbox" on the
        strength of a 202 it should never have been given tells a user to watch an
        inbox nothing is going to arrive in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryEmailRequest'
      responses:
        '202':
          description: Accepted. Identical for every address.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/MalformedBody'
        '409':
          description: This account's address is already verified, so there is nothing to prove.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://errors.cafaye.com/conflict
                title: Conflict
                status: 409
                detail: this account's email address is already verified
                instance: /v1/email-verifications
                code: conflict
                trace_id: 0af7651916cd43dd8448eb211c80319c
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/MailUnavailable'

  /v1/email-verifications/confirm:
    post:
      tags: [recovery]
      operationId: confirmEmailVerification
      summary: Spend a verification link
      description: |
        Sets `email_verified_at` on the account and returns 204.

        **It revokes nothing and mints nothing.** A verification is not a credential
        — it is a fact about an address, and a link that sets a boolean changes no
        secret. Ending every session over it would punish somebody for clicking a
        link that proved who they already were, and minting a session here would be
        a second way to turn a mailbox into a credential.

        404 for every token that is not live, for the reasons on
        `confirmPasswordReset`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryTokenRequest'
            examples:
              default:
                summary: redeem the link
                value:
                  token: 0Kq3Zs1oQw7bXn0K9dLpR2vT4yE6hJ8cF1gM5nA2qU0
      responses:
        '204':
          description: The address is now marked verified. No body.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
        '400':
          $ref: '#/components/responses/MalformedBody'
        '404':
          description: No live token matches — it never existed, expired, was spent, or belongs to another flow.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://errors.cafaye.com/not_found
                title: Not found
                status: 404
                detail: no such link, or it has already been used
                instance: /v1/email-verifications/confirm
                code: not_found
                trace_id: 0af7651916cd43dd8448eb211c80319c
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/email-verification:
    get:
      tags: [recovery]
      operationId: getEmailVerificationStatus
      summary: Whether the caller's own address is proved
      description: |
        The caller's verification state, and nothing else.

        **It is a separate route rather than a field on `GET /v1/me`**, and the
        reason is a test: `/v1/me`'s projection is asserted field-by-field to be
        exactly `id` and `email`, so adding `email_verified` there would either
        break that invariant or weaken it. And "is this address proved" is not the
        question "who am I" — a settings page asks the first, an app asks the
        second.

        `email_verified_at` is **absent** when the address has never been verified,
        which is different from an epoch timestamp, and different again from
        `email_verified: false` on an address that was proved and then changed:
        changing an address clears the verification, so the two unverified states
        are genuinely different and a client may want to tell them apart.

        A `200` for every signed-in account, never a 404 for an unverified one: the
        question has an answer for everybody, and a 404 would be indistinguishable
        from "this is not your account".
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's verification state.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationStatus'
              examples:
                verified:
                  summary: proved, at an instant
                  value:
                    email: kaka@example.com
                    email_verified: true
                    email_verified_at: '2026-09-30T12:10:00Z'
                neverVerified:
                  summary: never proved — no timestamp at all
                  value:
                    email: kaka@example.com
                    email_verified: false
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/email-changes:
    post:
      tags: [recovery]
      operationId: requestEmailChange
      summary: Start a move to a new address
      description: |
        Records the intent and mails a link to the address the account has **now**.
        Nothing moves yet: this creates the first of two tokens, and the second
        does not exist until the first is redeemed.

        That ordering is the whole of the hijack property. A stolen session can
        reach this route, and what it produces is a link in the victim's inbox and
        nowhere else — the attacker cannot advance the change, and the victim gets a
        message saying their address is being changed, which is the only warning
        they would otherwise get. A single-token design, where the link goes to the
        NEW address and completing it moves the account, is a takeover on anybody
        who can read the new inbox and nothing else.

        **Session only.** There is no scope in the machine vocabulary for "may move
        an account's recovery path", and there is not going to be one. A scoped API
        token is refused on all eight routes of this surface.

        Two refusals are worth reading, because both are the alternative being
        rejected:

        * **409** when the new address already has an account. This is the one
          disclosure this surface makes and it is safe here — the caller is
          authenticated as the person asking, and the alternative is a change that
          fails at the last step after two emails and two clicks. It is the same
          answer `POST /v1/users` gives.
        * **422 `already_current`** when the new address is the one already on the
          row. Refused rather than treated as a no-op, because a 202 here would
          leave the caller believing a change had been requested and confirmed.

        201 rather than 202: this is not a message being sent in the background, it
        is a change that has been recorded and has a deadline.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryEmailRequest'
            examples:
              default:
                summary: move to a new address
                value:
                  email: new-address@example.com
      responses:
        '201':
          description: The change is recorded and the first link is on its way to the current address.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChange'
              example:
                current_email: kaka@example.com
                new_email: new-address@example.com
                expires_at: '2026-10-02T12:00:00Z'
        '400':
          $ref: '#/components/responses/MalformedBody'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: An account already exists for the new address.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://errors.cafaye.com/conflict
                title: Conflict
                status: 409
                detail: an account already exists for that email address
                instance: /v1/email-changes
                code: conflict
                trace_id: 0af7651916cd43dd8448eb211c80319c
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/MailUnavailable'

  /v1/email-changes/current-address:
    post:
      tags: [recovery]
      operationId: confirmEmailChangeCurrentAddress
      summary: Prove control of the address the account has now
      description: |
        Spends the first token and mails the second one to the **new** address.
        Answers 202 with the same constant body every other accepted route gives.

        **The 202 body says nothing about the second link**, and that is the point.
        The caller has just proved they can read the current inbox, so they know
        they asked for this and know the next message goes to the address they
        typed. Naming the destination here would tell a hijacked session — which can
        reach this route with a token it does not have — nothing at all, while
        telling a legitimate user nothing they need.

        Presenting the second token here is a 404, not a partial success: the two
        tokens are for different inboxes and a token that worked on the wrong side
        would mean the wrong inbox proved something.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryTokenRequest'
      responses:
        '202':
          description: The current address is confirmed and the second link is on its way.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
              example:
                status: accepted
        '400':
          $ref: '#/components/responses/MalformedBody'
        '404':
          description: No live first-half token matches.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://errors.cafaye.com/not_found
                title: Not found
                status: 404
                detail: no such link, or it has already been used
                instance: /v1/email-changes/current-address
                code: not_found
                trace_id: 0af7651916cd43dd8448eb211c80319c
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/MailUnavailable'

  /v1/email-changes/new-address:
    post:
      tags: [recovery]
      operationId: confirmEmailChangeNewAddress
      summary: Complete a move to a new address
      description: |
        Spends the second token: the account's address moves, the verification is
        cleared, and every session and every live OIDC access token is revoked — in
        one transaction, with the session cookie cleared on the response.

        **It is a 200 with a body rather than a 204**, because this route does
        change three things the caller needs to know. A 204 would leave a client to
        rediscover all three by making three other requests.

        `email_verified` is **false**, and that is not a bug. Clicking a link proves
        you can read an inbox, not that the new address belongs to this account,
        and the write that moves the address clears `email_verified_at` in the same
        statement. A client rendering "your address is updated" from this body is
        correct; a client rendering "your address is verified" is not — prompt for
        `POST /v1/email-verifications` instead, which now targets the new address.

        Scoped API keys survive, for the reasons on `confirmPasswordReset`.

        Presenting the first token here is a 404, for the same reason the other way
        round is.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryTokenRequest'
      responses:
        '200':
          description: The address moved and every session and access token was revoked.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChange'
              example:
                current_email: new-address@example.com
                new_email: new-address@example.com
                email_verified: false
        '400':
          $ref: '#/components/responses/MalformedBody'
        '404':
          description: No live second-half token matches.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://errors.cafaye.com/not_found
                title: Not found
                status: 404
                detail: no such link, or it has already been used
                instance: /v1/email-changes/new-address
                code: not_found
                trace_id: 0af7651916cd43dd8448eb211c80319c
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{account_id}/oidc-clients:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [oidc-clients]
      operationId: registerOIDCClient
      summary: Register an OpenID Connect client
      description: |
        Registers a relying party: the credential a product presents at the token
        endpoint when it runs an authorization-code flow against this service.

        **Owner only.** Adding a client is adding a new way for code to arrive in
        this product and get a token back out, so a member of the account is 403
        and a non-member is 404.

        `client_id` and `client_secret` are minted here and returned here, and
        `client_secret` is returned **once**. It is never stored — only its
        SHA-256 is — and there is no endpoint that re-reads it. A caller that
        loses it registers again, which is the rule a session token, an
        invitation token and a password already follow.

        `redirect_uris` is matched EXACTLY. No prefix, no glob, no pattern of
        any kind: `https://app.example.com.evil.com/cb` is not a match for a
        registered `https://app.example.com/cb`, and a prefix comparison would
        make this service an open redirector for every product registered here.
        Plain `http` is accepted only on loopback, so a product can develop
        against a local stack without the registration ever accepting a
        plain-http origin.

        `scopes` is intersected with what this provider implements
        (`openid email profile accounts`) and must include `openid`. `grant_types`
        must be `authorization_code`: this service issues no refresh token, has
        no service identity for client credentials, and has no consent screen for
        an implicit flow, so registering any of them is refused at 422 with the
        field named rather than discovered at 3am.
      security:
        - sessionCookie: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOIDCClientRequest'
            example:
              name: Anytalk
              redirect_uris: ['https://app.anytalk.com/callback']
              grant_types: [authorization_code]
              scopes: [openid, email, profile, accounts]
      responses:
        '201':
          description: The registration, and its secret.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredOIDCClient'
              example:
                id: ab000000-0000-0000-0000-000000000001
                client_id: 8Jm1xQ0pQz7rV2nK4wL9cT6bY3hA5sD0fG1eI2jK
                client_secret: 5rT2wQ9zX1cV4bN6mK8jH0dF3gL5pS7aY9uE1iO
                name: Anytalk
                redirect_uris: ['https://app.anytalk.com/callback']
                grant_types: [authorization_code]
                scopes: [accounts, email, openid, profile]
                created_at: '2026-09-30T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [oidc-clients]
      operationId: listOIDCClients
      summary: List an account's OpenID Connect clients
      description: |
        Every registration this account owns, newest first. An account with none
        answers `[]` and not `null`.

        A bare array rather than core's `data` + `page` wrapper, and the omission
        is deliberate: this list is a handful of rows, and a cursor over four of
        them is a wrapper a client has to unwrap to render a settings page. The
        first account that wants a hundred products gets the wrapper then.
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '200':
          description: The account's registrations.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OIDCClient'
              example:
                - id: ab000000-0000-0000-0000-000000000001
                  client_id: 8Jm1xQ0pQz7rV2nK4wL9cT6bY3hA5sD0fG1eI2jK
                  name: Anytalk
                  redirect_uris: ['https://app.anytalk.com/callback']
                  grant_types: [authorization_code]
                  scopes: [accounts, email, openid, profile]
                  created_at: '2026-09-30T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{account_id}/oidc-clients/{client_id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: client_id
        in: path
        required: true
        description: |
          The registration's row id — not the `client_id` the product presents.
          The row id is what the revocation event's `subject` is, and what the
          other three routes name.
        schema:
          type: string
          format: uuid
    get:
      tags: [oidc-clients]
      operationId: getOIDCClient
      summary: Read an OpenID Connect client
      description: |
        One registration. `client_secret` and the stored digest are both absent
        and will stay absent: the secret exists once, in the 201.
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '200':
          description: The registration.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCClient'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [oidc-clients]
      operationId: revokeOIDCClient
      summary: Revoke an OpenID Connect client
      description: |
        Stops honouring the registration. The row is kept rather than deleted — an
        audit of which credentials existed is worth more than a tidier table, and
        `revoked_at` is what makes the difference readable afterwards.

        The revocation is real rather than advisory: every access token issued
        against this registration is revoked in the same transaction, because a
        token is a signed JWT that a verifier on the edge will keep accepting
        until its `exp` and revoking the registration does not by itself stop one.
        A token minted before the revocation therefore fails at userinfo
        immediately, not fifteen minutes later.

        204 rather than the revoked row, matching every other `DELETE` in this
        service. The `identity.oidc_client.revoked` event is where a consumer
        learns what happened.
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '204':
          description: The registration is revoked. No body.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The registration is already revoked. A 204 either way would leave an
            operator who clicked twice believing they had just destroyed a second
            credential.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{account_id}/api-keys:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [api-keys]
      operationId: mintAPIKey
      summary: Mint a scoped API token
      description: |
        The credential that is not a browser session: a long-lived, named, scoped,
        revocable token for a script, a CI job or another service.

        **Owner only**, and the reason is a security property rather than a
        convention. A machine credential outlives every session that made it and is
        exactly what a stolen password buys an attacker, so "can read the member
        list" is not authority to mint one — the same argument that makes
        registering an OIDC client owner-only.

        **The account comes from the path and the user from the session.** There is
        no `account_id` or `user_id` in the body, and a body carrying either is a
        422. A credential is minted BY the caller FOR the caller's own account; there
        is no subject field, and a machine credential that can be minted for somebody
        else is a way for an owner to plant a credential somebody did not choose to
        hold.

        **`token` is returned here and nowhere else, ever.** It is shown once, at
        creation, and there is no endpoint that re-reads it — not because one is
        missing but because there is nothing left to print: the row holds a SHA-256
        of a 256-bit value. A caller that loses it mints another. It is never in a
        cookie, because a credential in a cookie is one a browser silently attaches
        to a request its holder did not intend, which is what core means by "no
        cookies for API traffic".

        **`expires_in` is SECONDS from now** — the same name and the same shape
        RFC 6749's token response uses, so every OAuth client in the world already
        knows what it means. Omit it for the default (90 days). `0` or a negative
        value is a **422, not "never expires"**: a permanent credential is not
        something this build offers, and the ceiling is 365 days. The cost of that
        decision is real and is stated in README.md: a CI credential has to be
        replaced every quarter, and what it buys is a moment at which a credential
        nobody is using gets noticed.

        **One live token per name per account.** A second live token answering to
        this name is a 409, because "revoke ci-deploy" is otherwise ambiguous and an
        operator picking the wrong one leaves a credential live they believe they
        have destroyed. The constraint is on LIVE tokens only, so rotation is two
        requests — revoke, then mint the same name — and not a transaction that has
        to find a name free first.
      security:
        - sessionCookie: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MintAPIKeyRequest'
            examples:
              aReadOnlyToken:
                summary: A read-only token for a CI job
                value:
                  name: ci-deploy
                  scopes: [accounts:read]
              withALifetime:
                summary: Naming how long it should live
                value:
                  name: nightly-import
                  scopes: [accounts:read, accounts:write]
                  expires_in: 2592000
      responses:
        '201':
          description: |
            The credential, and its secret. `token` is the only place it appears.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedAPIKey'
              example:
                id: ab000000-0000-0000-0000-0000000000a1
                name: ci-deploy
                account_id: ab000000-0000-0000-0000-0000000000c1
                user_id: ab000000-0000-0000-0000-0000000000u1
                scopes: [accounts:read]
                expires_at: '2026-12-29T12:00:00Z'
                created_at: '2026-09-30T12:00:00Z'
                token: cafaye_Zq3vK7mXpR2tY8wB4cN6dF0gH1jK5lM9oP3qS7uV2wX4yZ8
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: This account already has a live token with that name.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [api-keys]
      operationId: listAPIKeys
      summary: List an account's API tokens
      description: |
        Every credential this account holds, newest first, **revoked ones
        included** — a token that has been withdrawn is how a person finds out that
        the credential they are about to revoke was withdrawn last Tuesday. An
        account with none answers `[]` and not `null`.

        **No secret, and no digest.** There is no column holding the plaintext, so
        there is nothing for a response to leak; and the digest is of no use to a
        client, so echoing the row's most sensitive column into a browser's network
        log would be a cost with no benefit. `prefix` is not in this document at
        all: a list distinguishes tokens by `name` and `id`, and a credential is
        identified by its name or its id — never by a piece of itself.
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        '200':
          description: The account's credentials.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKey'
              example:
                - id: ab000000-0000-0000-0000-0000000000a1
                  name: ci-deploy
                  account_id: ab000000-0000-0000-0000-0000000000c1
                  user_id: ab000000-0000-0000-0000-0000000000u1
                  scopes: [accounts:read]
                  expires_at: '2026-12-29T12:00:00Z'
                  created_at: '2026-09-30T12:00:00Z'
                  last_used_at: '2026-10-02T09:14:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{account_id}/api-keys/{key_id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: key_id
        in: path
        required: true
        description: |
          The credential's row id. A malformed one, one in another account and one
          that never existed are all `404` — the same answer, so an id is not a way
          to learn which credentials exist.
        schema:
          type: string
          format: uuid
    delete:
      tags: [api-keys]
      operationId: revokeAPIKey
      summary: Revoke an API token
      description: |
        Withdraws a credential. It stops working on the very next request: the
        resolution query filters on `revoked_at`, so there is no window.

        **The row is kept, not deleted.** "Was this token revoked, or was it always
        broken?" is a support question and a deleted row answers it for nobody. A
        revoked row holds a digest of a secret nobody has, so keeping it is not a
        risk.

        A second revoke is a **409, not a 204**: an operator who clicked twice is
        owed the truth, because a 204 the second time would leave them believing a
        second live credential had just been destroyed.

        `reason` is optional and is stored on the row. It is **not** in the
        `identity.api_key.revoked` event: nobody typed it consistently, it is not a
        fact about the credential, and a field whose values vary per operator is one
        every consumer learns to ignore.
      security:
        - sessionCookie: []
        - bearerToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeAPIKeyRequest'
            example:
              reason: rotated
      responses:
        '204':
          description: The credential no longer works.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The credential was already revoked.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{account_id}/admin/audit-log:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [admin]
      operationId: listAccountAuditLog
      summary: Read an account's admin audit trail
      description: |
        Every admin action taken on this account, newest first, and **append-only**:
        there is no operation in this API that edits or removes a record, and the
        table itself refuses `UPDATE` and `DELETE` at the database.

        ### Why the record cannot be edited, including by whoever performed it

        Three independent reasons, in the order a reviewer asks about them:

        1. **No route mutates it.** `GET` is the only method mounted on this path,
           and a test walks the router to hold that — a check inside the handler
           would pass even with a `DELETE` registered beside it.
        2. **No service method updates or deletes it.** The store has `Append` and
           `List` and nothing else.
        3. **The database refuses it**, with a `BEFORE UPDATE OR DELETE` trigger.
           This is the one that actually settles it: the first two only describe
           this codebase, and a repair script, an operator with `psql`, or a future
           packet all bypass Go entirely.

        For the same reason the table carries **no foreign key to `accounts`**. A
        cascade is a `DELETE`, so a cascading account deletion would be blocked —
        and more to the point, allowing it would mean the shortest route from "an
        admin did something questionable" to "there is no record of it" is one
        request to `DELETE /v1/accounts/{account_id}`. The rows become unreachable
        through the API and are retained for an operator reading the table directly.

        ### An audit record names a credential, never a credential

        `actor_user_id` and `actor_key_id` are **row ids**. There is no field in
        the response that could hold a token, and that is structural rather than a
        convention — the api key's digest is a field on the struct a handler holds,
        and an audit log is exactly where a careless `fmt.Sprintf("%+v", …)` of it
        would end up. A test walks the types that reach this table and fails if any
        grows a field that could hold a value.

        ### The page is bounded, and the bound is refused rather than clamped

        `limit` defaults to 25 and is refused above 100. A request for more is a
        **422, not a silent truncation**: a client that asked for 500 rows and
        quietly received 100 has been told a lie about how much of the trail it has
        read, and an operator building an export would produce a short one without
        knowing.

        `before` is an **opaque cursor**, returned as `next`. It is not an offset
        and not a bare timestamp: it carries the row's `(occurred_at, id)` pair
        encoded together, because a timestamp-only cursor silently drops every row
        sharing the boundary instant — and this service's clock is a timestamp, not
        a sequence, so two actions in the same second is the normal case. An
        offset would be wrong the moment a row is appended between two requests,
        which here is the normal case too: somebody is performing admin actions
        while somebody else pages through the record of them.

        A cursor this build did not issue is a **422 naming `before`**, not a
        silent return to the first page — on a trail, "your token was wrong" and
        "the records are missing" are very different conclusions.
      security:
        - bearerToken: []
      parameters:
        - name: limit
          in: query
          required: false
          description: |
            Rows to return. Defaults to 25; refused above 100. `0` means the
            default, so a generated client that sends its zero value still works.
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 25
        - name: before
          in: query
          required: false
          description: |
            The opaque `next` cursor from the previous page. Empty means the
            newest page.
          schema:
            type: string
      responses:
        '200':
          description: One page of the account's admin audit trail, newest first.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
              example:
                entries:
                  - id: ab000000-0000-0000-0000-0000000000d1
                    action: invitation.revoked
                    actor_user_id: ab000000-0000-0000-0000-0000000000u1
                    actor_key_id: ab000000-0000-0000-0000-0000000000a1
                    target: 4f2c0000-0000-4000-8000-00000000abcd
                    affected: 1
                    trace_id: 3f2b1a44-9c8e-4d1a-9f77-2b0c5e6a1d90
                    occurred_at: '2026-09-30T12:00:00Z'
                next: MiIyMDI2LTA5LTMwVDEyOjAwOjAwWiI2MTk3ZjItMTFlNi0zMWFhLTExYjhhMjM2ZmU2YzFlZA
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Not an admin of this account, or the token does not carry
            `audit_log:read`, or **a browser session was presented** — the admin
            surface is token-only.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{account_id}/admin/invitations/{invitation_id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - name: invitation_id
        in: path
        required: true
        description: |
          The pending invitation's row id. A malformed one, one in another account,
          one that never existed and one already redeemed are each answered the way
          their cause requires, but a caller **cannot tell "no such invitation" from
          "an invitation in an account you are not in"** — that would be a probe for
          which invitation ids exist.
        schema:
          type: string
          format: uuid
    delete:
      tags: [admin]
      operationId: revokeAccountInvitation
      summary: Revoke one pending invitation
      description: |
        Withdraws one pending invitation. The token stops redeeming it immediately,
        and an audit record is written **in the same database transaction** as the
        revocation — either both exist or neither does.

        **Admin of the account, with `account_invitations:write`.**

        ### No confirmation field, and that is the design

        The URL names the one thing being changed, so the request is
        self-describing: there is nothing in it that could be misread as "and
        everything else". The bulk route requires `confirm: true` and a named
        array; this one requires neither, and adding a `confirm` field here would
        mean a client that forgot to send it gets a 422 on a safe, idempotent,
        single-row operation.

        ### Revoking is not deleting

        The row is kept with `revoked_at` set, which is what lets
        "was this revoked, or was it always broken?" be answered — the same support
        question that keeps revoked api keys and OIDC clients rather than deleting
        them. It also **frees the address to be invited again**, which is the point
        of the operation: an admin who sent an invitation to the wrong list revokes
        it and sends another, in two requests.

        A **409** means the invitation is not in a revocable state — already
        accepted (a membership already exists, and the question is where it came
        from) or already revoked. A **404** is every other case, including an id
        belonging to another account.
      security:
        - bearerToken: []
      responses:
        '204':
          description: |
            The invitation no longer redeems, and an audit record naming the
            credential that did it exists in the same transaction.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Not an admin of this account, the token does not carry
            `account_invitations:write`, or a browser session was presented.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The invitation was already accepted or already revoked.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/accounts/{account_id}/admin/invitation-revocations:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [admin]
      operationId: revokeAccountInvitations
      summary: Revoke many pending invitations at once
      description: |
        Withdraws up to 50 pending invitations in one transaction, and writes **one**
        audit record for the whole batch.

        ### This is a different shape from the single route, on purpose

        A bulk operation is where an off-by-one becomes an outage, so it does not
        look like the single one:

        | | single | bulk |
        | --- | --- | --- |
        | request | `DELETE …/invitations/{id}` | `POST …/invitation-revocations` with a body |
        | confirmation | none needed — the URL names the one row | **`confirm: true` is required** |
        | minimum role | admin | **owner** |

        The `confirm` field is in the **body**, not a query parameter, so that the
        request that performs the operation and the request that describes it are
        the same bytes — a `?confirm=true` is one link-builder's accident away from
        being sent without an operator reading it, and the array is exactly the thing
        that must not be sent by accident. Absent, `false`, and the wrong JSON type
        are all the same 422: a client that got a different answer for `false` than
        for absent would have learned which one it sent.

        **An unknown field is a 422**, so a client that misspells `confirm` as
        `confirm_all` is told, rather than proceeding on the assumption it was
        confirmed.

        ### Why owner and not admin

        Revoking one invitation is a decision about a person. Revoking every
        pending one is a decision about the account, it is the operation a
        departing employee's automation might fire on a schedule, and an owner is
        the whole of the argument. There are only two roles above `member`, and the
        smaller one already has the single-revocation route.

        ### The bound is refused, not clamped

        More than 50 ids is a **422**, not a truncation. A request naming a thousand
        invitations that revoked the first fifty and reported nothing would be the
        outage this route exists to make harder.

        ### `requested` and `revoked` are both returned, and they differ

        Ids that were already revoked, or that belong to another account, change no
        rows, so `revoked` is frequently smaller than `requested`. Both numbers are
        in the response because a client that cannot tell "you asked for four and
        four went" from "you asked for four and two went" would report a completed
        task over an incident.

        **The count in the audit record is the number the database reported**, not
        the length of the request — a request naming six ids where two were already
        revoked records six, because six is the truth.
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkInvitationRevocation'
            examples:
              confirmed:
                summary: The shape a bulk revocation must have
                value:
                  invitation_ids:
                    - 4f2c0000-0000-4000-8000-00000000abcd
                    - 4f2c0000-0000-4000-8000-00000000abce
                  confirm: true
              missingConfirmation:
                summary: Refused — 422 naming `confirm`
                value:
                  invitation_ids:
                    - 4f2c0000-0000-4000-8000-00000000abcd
      responses:
        '200':
          description: |
            The batch ran. `revoked` may be smaller than `requested`; both are
            reported rather than reconciled.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkRevocationResult'
              example:
                requested: 2
                revoked: 2
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Not an **owner** of this account, the token does not carry
            `account_invitations:write`, or a browser session was presented.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/introspections:
    post:
      tags: [api-keys]
      operationId: introspectAPIKey
      summary: Resolve a presented API token to its claims
      description: |
        Asks "what may this token do, and for which account". It exists because the
        token is **opaque**: it is `cafaye_` plus 32 random bytes and the row holds
        a SHA-256 of it, so there is no claim document inside it and no published
        key set to verify it against. Asking identity is the only way a resource
        server can learn a scope. The response is RFC 7662's shape.

        The body takes the **credential, not an id** — an id would be an enumeration
        oracle over somebody else's credentials, and a value is only useful to
        somebody who already holds it.

        ### An unusable token answers `{"active": false}` and nothing else

        Unknown, revoked, expired, and one whose owner has been removed from the
        account are all the same 200 with the same body, and the status is 200
        rather than 404 because the endpoint succeeded — the answer is that the
        token is not active. A caller who could tell those apart would learn whether
        a leaked value was live, which is the second question an attacker asks after
        "does this work".

        ### The caller's own standing is a different question

        It gets different statuses, because it is a different fact about the
        request: **401** with no credential, and **403** for a token asking about
        anybody else's. A token may introspect **itself**, which is the case a CI job
        needs when it wants to know why it is being refused. A session may read a
        token in an account it **owns**; a session that is not in the account is
        404, for the reason every other route does that.

        ### The two scope claim names

        `scopes` and `scope` are **byte for byte identical**, and both are
        space-separated strings.

        This is a deliberate interim, not a contract. The fleet does not agree on the
        name: core's `docs/openapi-conventions.md` requires `scopes`, and guard's
        `src/middleware/jwt.ts` reads `scope` and splits it on whitespace. The
        question is open (MD7 in the manager's `DECISIONS.md`) and answering it
        unilaterally would mean rotating every credential already in a customer's
        hand. Emitting both means whichever name wins, the other is a one-line
        removal and no credential has to be reissued. A space-separated **string**
        rather than an array because guard's verifier refuses a non-string claim.

        ### `account_id` is required and there is no `sub` fallback

        `sub` is the **user** the token names. `account_id` is the tenancy boundary
        and it is always present; a token with no account cannot be used against any
        account and is answered `{"active": false}`. Nothing here falls back to
        `sub`, which would give a service-to-service token a user as its tenancy
        key and turn a bug in one service into a cross-tenant read.
      security:
        - sessionCookie: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntrospectRequest'
            example:
              token: cafaye_Zq3vK7mXpR2tY8wB4cN6dF0gH1jK5lM9oP3qS7uV2wX4yZ8
      responses:
        '200':
          description: |
            The claim document, or `{"active": false}` when the token cannot be
            used.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectionResponse'
              examples:
                active:
                  summary: A live token
                  value:
                    active: true
                    sub: ab000000-0000-0000-0000-0000000000u1
                    account_id: ab000000-0000-0000-0000-0000000000c1
                    scopes: accounts:read accounts:write
                    scope: accounts:read accounts:write
                    jti: ab000000-0000-0000-0000-0000000000a1
                    name: ci-deploy
                    role: owner
                    iat: 1788168000
                    exp: 1790760000
                inactive:
                  summary: A token that cannot be used, for any reason
                  value:
                    active: false
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /healthz:
    get:
      tags: [probes]
      operationId: liveness
      summary: Liveness
      description: |
        Answers whether this process is running. It never touches a dependency, so
        a database outage cannot get the process restarted out from under
        in-flight work.
      security: []
      responses:
        '200':
          description: The process is running.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok

  /readyz:
    get:
      tags: [probes]
      operationId: readiness
      summary: Readiness
      description: |
        Answers whether this process can serve traffic, by probing each named
        dependency. `deps` lists what was probed, `"none"` when there is nothing to
        probe.

        A failing dependency is named but not described: the underlying error goes
        to the log, because an unauthenticated request must not be a way to learn
        that a database host is at a particular address.
      security: []
      responses:
        '200':
          description: Every dependency answered.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                withDatabase:
                  value:
                    status: ok
                    deps: postgres
                withoutDatabase:
                  value:
                    status: ok
                    deps: none
        '503':
          description: |
            At least one dependency did not answer.

            This is the one non-2xx response in the service that is not a problem
            document, and it is a known conflict rather than an oversight. See
            "Known gaps", item 4.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: unavailable
                deps: postgres

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: |
        The browser surface. A `__Host-` cookie is accepted by the browser only
        when it is `Secure`, has `Path=/` and carries no `Domain`, which is what
        binds it to this origin and stops a sibling origin from setting it.

        This is the "different surface" core's auth section describes, not an
        exception to "no cookies for API traffic".
    bearerToken:
      type: http
      scheme: bearer
      description: |
        The API surface. **Two** credentials are accepted here and they are
        distinguished by their shape, not by a flag:

        * a **session token** from `POST /v1/session` — a browser credential, with
          the full authority of its role.
        * a **scoped API token** from `POST /v1/accounts/{account_id}/api-keys` —
          `cafaye_` followed by 43 base64url characters. Narrowed by a scope set,
          bound to one account, revocable, expiring.

        The `cafaye_` prefix is what tells them apart, before any query runs, so a
        value of one kind is never looked up in the other's table. A scoped token
        is accepted on the account-scoped routes only, and only where its scope
        allows; it is **refused with 403** on the session surface, the second
        factor, the credential surface and the account collection routes.

        A scoped token presented anywhere it is not accepted is 401, the same
        answer as a session token that never existed — revoked, expired, and one
        whose owner has been removed from the account are all that too.

        ## Required scopes, per operation

        | Operation | Scope | Enforced on |
        |---|---|---|
        | `getAccount`, `listMembers` | `accounts:read` | the tenancy reads |
        | `renameAccount`, `inviteMember`, `changeMemberRole`, `removeMember` | `accounts:write` | the account's mutations except deleting it |
        | `deleteAccount` | `accounts:delete` | `DELETE /v1/accounts/{account_id}` and nothing else |
        | the four `oidc-clients` operations | `oidc_clients:write` | an account's OpenID Connect registrations |
        | `mintAPIKey`, `revokeAPIKey`, `listAPIKeys` | *(none)* | **refused to every token**, with 403 |

        Four names, a closed set, and every one of them is a capability an existing
        route already enforces a different way. A scope for something this service
        cannot do is a promise rather than a control.

        The three collection operations — `listAccounts`, `createAccount`,
        `acceptInvitation` — have **no scope and refuse every token**, and the reason
        is not an oversight: each answers a question about the caller's *whole set*
        of accounts, and a token is bound to one account. A CI job holding a token
        for one tenant is not entitled to an inventory of every other tenant its
        owner belongs to.

        There is no scope for the second factor, for sessions, or for a wildcard
        meaning "everything". A machine credential that can turn a second factor off
        is a credential whose theft is a *downgrade* rather than a break-in, and
        "read this account" and "delete this account" are two decisions a person
        makes twice.

        A **session** carries no scopes and is not refused for that. A session is a
        human's credential with the full authority of its role; a token is a
        narrowed one. That asymmetry is the whole difference between the two.
      x-scopes:
        - accounts:read
        - accounts:write
        - accounts:delete
        - oidc_clients:write

  parameters:
    AccountId:
      name: account_id
      in: path
      required: true
      description: |
        The account. A caller who is not a member of it gets 404 and never 403,
        because a 403 would confirm the account exists to somebody guessing ids.
      schema:
        type: string
        format: uuid

  headers:
    TraceId:
      description: |
        Correlates this response with the service's logs. Always present, and
        always equal to the `trace_id` in a problem body. An inbound value is
        reused when it is a well-formed identifier and replaced otherwise, so a
        trace survives a proxy hop without letting a caller forge a header.
      required: true
      schema:
        type: string
        maxLength: 200
      example: 0af7651916cd43dd8448eb211c80319c
    ClearedSessionCookie:
      description: |
        An expired `__Host-session` cookie, with the same attributes that set it.

        Sent by the two routes that revoke the caller's own session as a side
        effect — `confirmPasswordReset` and `confirmEmailChangeNewAddress` — so a
        browser is not left holding a credential the request it just made has
        killed.
      schema:
        type: string
      example: '__Host-session=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0'

  schemas:
    APIKey:
      type: object
      description: |
        A scoped API token as the settings page sees it.

        **There is no `token` field here, and that is not an omission.** The
        plaintext exists exactly once, in the `201` from
        `POST /v1/accounts/{account_id}/api-keys`; there is no column holding it and
        no endpoint that re-reads one. `IssuedAPIKey` below is the only shape with
        that field, and it embeds this one — so the list handler cannot reach it even
        by accident.

        Nor is there a `token_digest`. It is of no use to a client, and echoing the
        row's most sensitive column into a browser's network log would be a cost
        with no benefit. A token is identified by its `name` or its `id`, and never
        by a piece of itself — that is a rule for the logs this service writes as
        much as for this response.
      required: [id, name, account_id, user_id, scopes, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: |
            The row's own id. This is what a revoke names and what a test uses to
            identify a credential.
        name:
          type: string
          maxLength: 80
          description: |
            What a human calls this in a list. Required, because an operator revokes
            by what they can read; a token nobody can tell apart from another is one
            nobody remembers to revoke.
        account_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: |
            The user who minted it, and the only subject it ever has. A credential
            is minted BY the caller FOR the caller's own account.
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          description: |
            The granted capabilities. An **array** here and not the
            space-separated string of the claim document: this is a REST list, and
            the claim form is the wire shape for something a resource server parses
            out of a token. They are the same set.
          items:
            $ref: '#/components/schemas/APIKeyScope'
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          description: |
            Absent when the token has never been presented. `omitempty` is doing
            real work: "never used" and "used at the epoch" are different answers
            and only the first is true.

            Accurate to within five minutes, deliberately. A CI token at a thousand
            requests a second must not put a thousand UPDATEs a second on one row,
            and a single row's lock is a queue.
        revoked_at:
          type: string
          format: date-time
        revoke_reason:
          type: string
          maxLength: 200
          description: |
            Why it was withdrawn, when an operator gave a reason. Either a sentence
            somebody typed, or the closed value `membership removed` that
            `accounts.Service.RemoveMember` writes.

    APIKeyScope:
      type: string
      description: |
        One of four names, in core's `resource:action` shape. The set is closed and
        adding one is a code change rather than a migration, which is why a token
        holding a name this build does not know is refused at the point of use
        rather than being treated as "and so anything goes".
      enum:
        - accounts:read
        - accounts:write
        - accounts:delete
        - oidc_clients:write

    IssuedAPIKey:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          description: |
            The create response, and the ONLY place a credential's plaintext
            appears.
          required: [token]
          properties:
            token:
              type: string
              description: |
                The credential: `cafaye_` plus 43 base64url characters. Shown once,
                here, and unrecoverable afterwards — not because an endpoint is
                missing but because the row holds a SHA-256 of a 256-bit value.
                A caller that loses it mints another.

                The prefix is a feature and the feature is recognition: a secret
                that leaks into a CI log, a shell history or a support ticket is
                recognised as a cafaye credential by its first seven characters,
                which turns "somebody has to work out which of these strings is
                working" into a grep.

    BulkInvitationRevocation:
      type: object
      description: |
        **Both fields are required, and neither is optional.** `confirm` is the
        whole of the difference between this route and the single-revocation route,
        and an array with no confirmation is exactly the request that revokes every
        pending invitation by accident.

        An unknown field is a 422, so a client misspelling `confirm` is told rather
        than proceeding.
      required: [invitation_ids, confirm]
      additionalProperties: false
      properties:
        invitation_ids:
          type: array
          minItems: 1
          maxItems: 50
          description: |
            The pending invitations to revoke, as row ids. **At most 50** — a larger
            request is a 422 rather than a truncation, because a request naming a
            thousand invitations that silently revoked the first fifty is the outage
            this route exists to make harder.

            Ids that are already revoked, already accepted, or belong to another
            account are not an error: they change no rows and are not counted in
            `revoked`. That is why the response reports both counts.
          items:
            type: string
            format: uuid
        confirm:
          type: boolean
          const: true
          description: |
            Must be `true`. `false` is the same answer as absent — a 422 naming
            `confirm` — so a client cannot learn from the response which value it
            sent.
          example: true

    BulkRevocationResult:
      type: object
      description: |
        `requested` is what the request named and `revoked` is what the database
        changed, and they are frequently different. Both are reported rather than
        reconciled, because a client that cannot tell "you asked for four and four
        went" from "you asked for four and two went" would report a completed task
        over an incident.
      required: [requested, revoked]
      properties:
        requested:
          type: integer
          minimum: 1
          maximum: 50
          description: How many invitation ids the request named, after de-duplication.
        revoked:
          type: integer
          minimum: 0
          maximum: 50
          description: |
            How many pending invitations the database actually changed. **This is
            also the number in the audit record** — the one the mutation reported,
            not the length of the request.

    AuditLogPage:
      type: object
      description: |
        One bounded page of the account's admin audit trail, newest first.
      required: [entries]
      properties:
        entries:
          type: array
          description: |
            Present and empty when there is nothing, rather than omitted: "no
            entries" and "the server left the field out" are different answers and
            a client that has to tell them apart will eventually get it wrong.
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        next:
          type: string
          description: |
            The opaque cursor for the following page, **absent on the last page**.

            It encodes the last row's `(occurred_at, id)` pair together and is
            passed back verbatim in `before`. It is not an offset, and it is not a
            bare timestamp: a timestamp-only cursor drops every record sharing the
            boundary instant, and this service's clock is a timestamp rather than a
            sequence, so two admin actions in the same second is the normal case.
          example: MiIyMDI2LTA5LTMwVDEyOjAwOjAwWiI2MTk3ZjItMTFlNi0zMWFhLTExYjhhMjM2ZmU2YzFlZA

    AuditLogEntry:
      type: object
      description: |
        One admin action.

        **There is no field here that could hold a credential, and that is
        structural rather than a convention.** `actor_user_id` and `actor_key_id`
        are row ids. The api key's digest is a field on the struct a handler holds,
        and an audit log is exactly where a careless `fmt.Sprintf("%+v", …)` of it
        would end up — so a test walks the types that reach this table and fails if
        any of them grows a field that could hold a value.

        An operator copies this response into an incident ticket, and a response
        shape with a `token` field is one somebody will eventually populate.
      required: [id, action, actor_user_id, actor_key_id, target, affected, trace_id, occurred_at]
      properties:
        id:
          type: string
          format: uuid
          description: The record's own id.
        action:
          type: string
          enum: [invitation.revoked, invitations.revoked]
          description: |
            What was done, from a closed set validated in Go rather than by a
            schema CHECK — a closed vocabulary is a code fact, and putting it in
            the schema would make adding an action a migration.

            The two names are distinct because the two are different events: one
            invitation revoked is a decision about a person, and a hundred at once
            is a decision about the account. Collapsing them would lose the answer
            an operator is asking for — "was that one, or was that all of them".
        actor_user_id:
          type: string
          format: uuid
          description: The human the acting token was minted for.
        actor_key_id:
          type: string
          format: uuid
          description: |
            **Which** token acted — the row's id, never its value. "Somebody in the
            account" is not an answer an incident review can use, and this is the id
            an operator revokes by.
        target:
          type: string
          maxLength: 64
          description: |
            A short label for what was acted on: an invitation id for the single
            route, `invitation-revocations` for the bulk one. A label and not a
            list, so one record stays one record however large the request was.
        affected:
          type: integer
          minimum: 0
          description: |
            How many rows the action changed — the number the mutation reported, not
            the length of the request. `0` on the bulk route means every named
            invitation was already in a non-revocable state, and the response's
            `revoked` count says so too.
        trace_id:
          type: string
          description: |
            The request's trace id, which is also the `X-Trace-Id` response header
            and the `trace_id` in the problem document if the action failed. This
            joins an audit record to a log line without either carrying a timestamp
            comparison. Never a credential.
        occurred_at:
          type: string
          format: date-time
          description: When the action happened, from the service's clock.

    MintAPIKeyRequest:
      type: object
      description: |
        **The account and the user are not here.** They come from the path and the
        session, and a body carrying `account_id` or `user_id` is a 422 — because a
        body that could carry them is a body where they are ambiguous.
      required: [name, scopes]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: |
            Trimmed, and refused if it holds a control character: a name lands in a
            log line, a settings page and an incident report, and one carrying a
            newline is three lines where somebody wrote one.
        scopes:
          type: array
          minItems: 1
          maxItems: 8
          description: |
            Required, and refused rather than defaulted. A token with no scopes is a
            session that never expires, and it arrives as "the client did not send
            the field" — which is exactly how the dangerous case looks.

            An unsupported scope is a 422 naming the field, not a silent drop: a CI
            job that asked for `accounts:admin` and silently received
            `accounts:read` runs for a week and fails on the write it was written
            to do.
          items:
            $ref: '#/components/schemas/APIKeyScope'
        expires_in:
          type: integer
          format: int64
          minimum: 1
          description: |
            **Seconds from now**, the same name and shape RFC 6749's token response
            uses. Omit it for the 90-day default. `0` and negative values are 422:
            a permanent credential is not something this build offers, and the
            ceiling is 365 days.

    RevokeAPIKeyRequest:
      type: object
      description: |
        Optional in the strongest sense — a `DELETE` with no body at all is a
        revoke, because "revoke this" with no explanation is the common request and
        refusing it for want of a JSON document would be a 400 on a DELETE that needs
        nothing else.
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 200

    IntrospectRequest:
      type: object
      description: |
        The **credential**, not an id. An id would be an enumeration oracle over
        somebody else's credentials, and a value is only useful to somebody who
        already holds it.
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The presented value, prefix and all.

    IntrospectionResponse:
      type: object
      description: |
        RFC 7662's shape. When `active` is false this object is **exactly**
        `{"active": false}` and carries nothing else — a `sub` on an inactive
        document is a user id handed to whoever asked, and a refusal that differs
        per reason is an oracle for whether a leaked value was live.
      required: [active]
      properties:
        active:
          type: boolean
        sub:
          type: string
          format: uuid
          description: |
            The **user** the token names. It is not the tenancy key, and nothing in
            this document falls back to it.
        account_id:
          type: string
          format: uuid
          description: |
            The tenancy boundary, and **required** on an active document. core's
            rule is that every query is scoped by `account_id` from the token and
            never from the request body; a token with no account cannot be used
            against any account and is answered `{"active": false}`.
        scopes:
          type: string
          description: |
            The capability set as a **space-separated string** — core's required
            claim name.
        scope:
          type: string
          description: |
            An **exact mirror of `scopes`**, and the name `guard` reads. Both are
            emitted because the fleet has not agreed on one (MD7, open) and
            answering it here would mean rotating every credential already in a
            customer's hand. Whichever name wins, the other is a one-line removal
            and no credential has to be reissued. **Two names is not a contract.**
        jti:
          type: string
          format: uuid
          description: The credential's row id, which is what a consumer correlates on.
        name:
          type: string
          description: What a human would call this credential.
        role:
          type: string
          description: |
            The owner's **live** membership role, read at the instant of the claim
            rather than snapshotted at issue.

            It is here for an operator reading the response, and it is **not** an
            authorization input: core's rule is that services check scopes and ask
            identity, and a role in a claim is a role a service might start
            branching on.
        iat:
          type: integer
          format: int64
        exp:
          type: integer
          format: int64
        last_used_at:
          type: integer
          format: int64

    User:
      type: object
      description: |
        The public projection of an account. Exactly two fields, always: there is
        no password digest, no lockout state and no timestamp here, and adding one
        is a contract change.
      additionalProperties: false
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
          description: The account's identifier, and the `subject` of its events.
        email:
          type: string
          format: email
          maxLength: 320
          description: Always lower case. Registration normalizes before storing.

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: Normalized to lower case and trimmed before storage and before comparison.
        password:
          type: string
          minLength: 8
          maxLength: 1024
          description: |
            At least 8 characters, hashed with argon2id. There is no composition
            rule: requiring a mix of character classes reliably produces
            "Password1!" and reliably rejects passphrases, and length is the
            property that tracks entropy.

            The upper bound is a DoS control, not a policy. argon2id's cost is
            fixed in memory but its input is not, so without it an unauthenticated
            caller chooses the size of every login's hashing work.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
          description: |
            The minimum length is 1 here, not 8. A login is not a registration:
            refusing to check a short password would be a way to learn which
            passwords are in use, and an account may predate any rule. The upper
            bound still applies, because it bounds the hashing work.

    Session:
      type: object
      additionalProperties: false
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: |
            256 bits from crypto/rand, base64url without padding. Only its
            SHA-256 is stored; a database dump yields no usable credential.
          minLength: 43
          maxLength: 43
        expires_at:
          type: string
          format: date-time
          description: RFC3339 UTC. Judged against the service's clock, not the database's.

    OIDCClient:
      type: object
      description: |
        One OpenID Connect registration. `client_secret` and `secret_digest` are
        both absent and always will be: the secret exists once, in the 201, and
        the digest is what the row holds.
      additionalProperties: false
      required: [id, client_id, name, redirect_uris, grant_types, scopes, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: |
            The row's identifier, and the `subject` of its events. NOT the
            `client_id` the product presents — those are different values and
            conflating them is how a consumer ends up correlating on something it
            cannot look up.
        client_id:
          type: string
          minLength: 43
          maxLength: 43
          description: |
            The public, protocol-visible handle: 32 random bytes, base64url without
            padding. Unguessable rather than merely unique, because it is half of
            the credential pair on the token endpoint.
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            What the login page calls the product. Required, because a login page
            that cannot name the application asking for a password is the setup
            for a credential-phishing page on this service's own domain.
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: uri
          description: |
            The allow-list, matched EXACTLY. No prefix, no glob, no pattern. A
            registered URI may be `https`, or `http` on loopback only; a fragment
            and a wildcard are both refused. Sorted, and deduplicated.
        grant_types:
          type: array
          minItems: 1
          items:
            type: string
            enum: [authorization_code]
          description: |
            Always `authorization_code` today. This service issues no refresh
            token, has no service identity for client credentials, and has no
            consent screen for an implicit flow.
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [openid, email, profile, accounts]
          description: |
            A subset of what this provider implements, intersected with what the
            provider supports, and always including `openid`. A client that did
            not register a scope cannot be granted it by asking at the authorize
            endpoint.
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          description: |
            Absent while the registration is live. A revoked registration is kept
            rather than deleted, and this is what makes the difference readable
            afterwards.

    RegisteredOIDCClient:
      allOf:
        - $ref: '#/components/schemas/OIDCClient'
        - type: object
          additionalProperties: false
          required: [client_secret]
          properties:
            client_secret:
              type: string
              minLength: 43
              maxLength: 43
              description: |
                32 random bytes, base64url, returned in this 201 and never again.
                Only its SHA-256 is stored, so a dump of the registrations table is
                not a set of credentials. Losing it means registering again.

    RegisterOIDCClientRequest:
      type: object
      additionalProperties: false
      required: [name, redirect_uris, grant_types, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: uri
        grant_types:
          type: array
          minItems: 1
          items:
            type: string
            enum: [authorization_code]
        scopes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [openid, email, profile, accounts]
          description: |
            Names outside this set are DROPPED rather than refused, and this is the
            one place that is true: a product registering itself asks for what it
            would like and the operator curates what it gets. The authorization
            endpoint, where a caller asks for a token right now, refuses.

    # -----------------------------------------------------------------------
    # the second factor
    #
    # The three that matter most are read in this order: MFAChallenge is what a
    # login hands back instead of a session, FactorRequest is the one field every
    # destructive second-factor route carries, and StartedEnrollment is the only
    # place a TOTP secret ever appears.
    # -----------------------------------------------------------------------

    MFAChallenge:
      type: object
      description: |
        The 202 from `POST /v1/session`: a correct password, an unfinished
        authentication, and nothing else.

        There is no `token` property here and adding one would be the bug this
        document exists to prevent. The `challenge` is what `POST /v1/session/mfa`
        is answered with, and it is worthless on its own.
      additionalProperties: false
      required: [mfa_required, challenge, expires_at]
      properties:
        mfa_required:
          type: boolean
          description: |
            Always `true` in this body. It is here so a client that keys off a
            field rather than the status code has one to key off, and a client
            that keys off the 202 does not need to read it.
        challenge:
          type: string
          minLength: 43
          maxLength: 43
          description: |
            256 bits from crypto/rand, base64url without padding, presented to
            `POST /v1/session/mfa` as `challenge` or as the
            `__Host-mfa-challenge` cookie. Single-use and short-lived: the
            challenge row is deleted in the same transaction that creates the
            session, so it cannot be answered twice.

            Only its SHA-256 is stored, so a database dump yields no usable
            challenge.
        expires_at:
          type: string
          format: date-time
          description: |
            Ten minutes, judged against the service's clock. Shorter than the
            fifteen-minute factor lockout, deliberately: a lockout outlives its
            own challenge, so a user who trips it can answer a fresh code against
            a fresh challenge as soon as the window ends rather than waiting for
            the stuck challenge to expire.

    MFAStatus:
      type: object
      description: |
        Whether the caller has a second factor.

        A `200` with `enabled: false`, not a 404, when there is none: the question
        has an answer for every signed-in user, and a settings page should not
        have to distinguish "you have none" from "this is not your account".
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        method:
          type: string
          enum: [totp]
          description: |
            Absent when `enabled` is false. `"totp"` and "no method yet" are
            different answers, which is why this is `omitempty` rather than an
            empty string.
        enrolled_at:
          type: string
          format: date-time
          description: When the credential was confirmed. Absent when `enabled` is false.
        recovery_codes_remaining:
          type: integer
          minimum: 0
          description: |
            How many unused recovery codes are left. Absent when `enabled` is
            false.

            It is here so a client can say "2 left — print a new set" while there
            are still two. A user with zero codes and a lost phone is a support
            ticket, and the honest thing is to say so beforehand.

    FactorRequest:
      type: object
      description: |
        The body of every route that changes or relies on an existing second
        factor.

        **One field, not `code` and `recovery_code`.** The consequence of getting
        this wrong is identical either way, and two fields would let a client put
        a recovery code in the TOTP field and be told the code was malformed rather
        than not accepted, which is a worse error to act on. This service decides
        which shape it is and then answers the same way for both.
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            A six-digit TOTP code, or a recovery code in the form
            `XXXX-XXXX-XXXX-XXXX`. Surrounding whitespace is ignored; nothing else
            is.

            A code is not echoed back in any response, and never appears in a log
            line or a problem body.

    CompleteSecondFactorRequest:
      type: object
      description: |
        The second half of a login. `challenge` is optional here and required in
        effect — omitting it entirely, with no challenge cookie either, is a 401.
      additionalProperties: false
      required: [code]
      properties:
        challenge:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            The challenge from the 202. **Optional, because the
            `__Host-mfa-challenge` cookie is accepted instead** — the cookie is the
            browser's route and this field is the API client's, exactly as
            `POST /v1/session` returns the session token in the body as well as in
            the cookie so a non-browser client has a way in.

            When both are present the body wins. A client holding both has said
            which one it means, and answering from ambient browser state would
            make the result depend on invisible cookies.
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: A six-digit TOTP code, or a recovery code. Same shapes as `FactorRequest.code`.

    StartEnrollmentRequest:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Required **only** when this account already has a credential, where
            the request is a rotation.

            The service decides which case it is from the rows, so sending a code
            for a first enrollment is not wrong, only redundant — which is why
            this is optional in the schema and required in prose. Refusing the
            redundant one would be a 422 that teaches a client nothing.

    StartedEnrollment:
      type: object
      description: |
        A pending TOTP enrollment, and the only response in this document that
        contains a TOTP secret.

        **The secret is here and nowhere else.** There is no endpoint that
        re-reads it, so a client that loses this body starts a new enrollment,
        which mints a new secret. The reasoning is the one an OIDC
        `client_secret` follows: a secret this service can produce again is a
        secret this service is storing, and a stored TOTP secret is a second
        factor for whoever reads the database.

        Nothing here is a session, and nothing here is MFA. A pending enrollment
        is unread by the login path, so until `/confirm` is called this account
        has no second factor.
      additionalProperties: false
      required: [enrollment_id, secret, provisioning_uri, method, digits, period_seconds, algorithm, expires_at, replaced]
      properties:
        enrollment_id:
          type: string
          format: uuid
          description: |
            The id to confirm. It is the pending row's own id, and another user's,
            an expired one's and an already-confirmed one's are all 404 — so it is
            not a way to learn which enrollments exist.
        secret:
          type: string
          description: |
            base32, no padding, 160 bits from crypto/rand. The shared secret for
            `HMAC-SHA1`, and the half of the factor the phone holds.

            Stored **encrypted**, not hashed: verifying a code means computing an
            HMAC with this value, so a hash would be useless. At rest it is
            AES-256-GCM ciphertext under `MFA_ENCRYPTION_KEY`, with the user's id
            as additional authenticated data.
        provisioning_uri:
          type: string
          format: uri
          description: |
            An `otpauth://totp/…` URI, which is what a QR code encodes. Contains
            `secret`, so it is not shareable and not cacheable.
        method:
          type: string
          enum: [totp]
        digits:
          type: integer
          enum: [6]
          description: The code length. Fixed, and 6 because that is what authenticator apps display.
        period_seconds:
          type: integer
          enum: [30]
          description: |
            The step, 30 seconds. Returned rather than assumed so a client can
            render a countdown without hard-coding it.
        algorithm:
          type: string
          enum: [SHA1]
          description: |
            `SHA1`, and not a preference: it is the only HMAC every authenticator
            app implements. A user whose app rejected SHA1 has no app.
        expires_at:
          type: string
          format: date-time
          description: |
            Ten minutes. An unconfirmed enrollment is deleted after this, because
            a stored-but-never-confirmed secret is exactly the state that locks
            somebody out of their own account.
        replaced:
          type: boolean
          description: |
            `true` when this enrollment is replacing an existing credential.

            The old secret is **still live** until this one is confirmed, so an
            abandoned rotation costs nothing and the user is not left with a dead
            phone. `replaced` is what lets a client say so out loud rather than
            leave them to discover it.

    ConfirmEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            A six-digit code computed from this enrollment's `secret`.

            Required always, and an absent one is the only 422 on this surface:
            the code is required rather than wrong, and telling those apart saves
            a user staring at a six-digit box wondering what they did.

            Wrong, already spent, malformed, and produced by a secret this
            rotation has already replaced are all the same 401. They are four
            different facts and a client that can tell them apart learns which to
            keep trying.

    ConfirmedEnrollment:
      type: object
      description: |
        MFA is live, and here are the recovery codes, once.

        **Every session this account holds was revoked to produce this response**,
        including the caller's. A session minted under a one-factor policy was
        minted on a password alone, and leaving it alive means whoever holds it
        does not have to solve the new problem.

        The response is therefore `200` and not `204`: there is real content, and
        that content exists exactly once.
      additionalProperties: false
      required: [enabled, method, enrolled_at, recovery_codes, replaced_existing_secret]
      properties:
        enabled:
          type: boolean
          enum: [true]
        method:
          type: string
          enum: [totp]
        enrolled_at:
          type: string
          format: date-time
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: '^[0-9A-Z]{4}-[0-9A-Z]{4}-[0-9A-Z]{4}-[0-9A-Z]{4}$'
          description: |
            Ten codes, 80 bits each, and **never readable again**: no endpoint
            re-reads them and no column stores them, only a SHA-256 digest per
            code. Each is accepted exactly once and is destroyed by use.

            80 bits is a floor, not a style choice. A six-digit TOTP code is 20
            bits and is only safe because it changes every 30 seconds and cannot
            be retried; a recovery code does not change, so a short one would be
            guessable at leisure.
        replaced_existing_secret:
          type: boolean
          description: |
            `true` when this confirmation replaced a credential. The old one is
            deleted by this call, which is what makes its codes stop being
            accepted — the old phone stops working at the moment of confirmation,
            not at the moment the rotation started.

    RecoveryCodesResponse:
      type: object
      description: |
        A fresh set of recovery codes. The old set is destroyed by this call, in
        the same transaction that writes the new one.

        A partial write would leave a user with two live sets, which is a second
        recovery path through codes nobody audited and nobody will ever see in a
        log. That is the requirement this route exists to satisfy.
      additionalProperties: false
      required: [recovery_codes, issued_at, recovery_codes_remaining]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: '^[0-9A-Z]{4}-[0-9A-Z]{4}-[0-9A-Z]{4}-[0-9A-Z]{4}$'
          description: |
            The new set, returned once and never again. Same 80-bit value as
            `ConfirmedEnrollment.recovery_codes`, and the same one-shot guarantee.
        issued_at:
          type: string
          format: date-time
        recovery_codes_remaining:
          type: integer
          enum: [10]
          description: |
            Always 10. It is the count of the set just issued rather than a read
            back from storage, because a client rendering "you now have N codes"
            wants N and not a round trip to learn it.

    RecoveryEmailRequest:
      type: object
      description: |
        An address to look an account up by, on the three routes that start a
        flow.

        **It is never the address that gets proved or moved.** On
        `requestEmailVerification` it identifies the account whose *stored* address
        is proved, and on `requestEmailChange` it is the address being moved TO.
        A token that verified whatever address this field carried would be a
        registration of somebody else's inbox.
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: Normalized to lower case and trimmed before comparison.

    RecoveryTokenRequest:
      type: object
      description: |
        A single-use token from an emailed link. It is one field on purpose, and
        the three routes that take it do not all accept the same set: a shared type
        with an optional `password` would invite a client to send a password to a
        verification endpoint, where it would be ignored — and "ignored" is a worse
        answer than "refused", because a caller that believed the field was
        accepted would not know to retry.

        **The token is the credential.** These routes are anonymous, so the only
        thing being authenticated is the value in this field.
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          description: |
            256 bits from crypto/rand, base64url without padding. Only its SHA-256
            is stored, so a database dump yields no usable credential.

            43 characters, and the length is load-bearing on the client side rather
            than incidental: it is what tells a caller the value is complete before
            it is pasted into a URL.

    ConfirmPasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          description: The token from the emailed link. See `RecoveryTokenRequest`.
        password:
          type: string
          minLength: 8
          maxLength: 1024
          description: |
            The same rules and the same argon2id hashing a registration uses, and
            enforced identically. A new password is not an excuse to accept one
            that registration would have refused.

            The upper bound is a DoS control on an unauthenticated route: argon2id's
            cost is fixed in memory but its input is not, so without it a caller
            with no session chooses the size of the hashing work.

    Accepted:
      type: object
      description: |
        The body of every route that has been asked to send a message.

        **Exactly one field, with one value, ever.** That is the whole of the
        account-enumeration defence on `requestPasswordReset`,
        `requestEmailVerification` and `confirmEmailChangeCurrentAddress`: a
        registered address, an unregistered one and an address inside the cooldown
        all get these same bytes. Adding an `expires_at`, an `email` or a `sent`
        boolean here would reinstate an oracle without touching a test, so the
        handler's type is a constant for the same reason.
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted]
          example: accepted

    VerificationStatus:
      type: object
      description: |
        Whether one address is proved, as `GET /v1/email-verification` reports it.

        The boolean and the timestamp say the same thing in two shapes and both are
        present because a client needs one and not the other: a boolean for a
        conditional render, an instant for "verified on". The timestamp is
        **absent** rather than null when the address was never verified — "never
        verified" and "verified at the epoch" are different answers and only the
        first is true.
      additionalProperties: false
      required: [email, email_verified]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: The address on the account. Always lower case.
        email_verified:
          type: boolean
          description: |
            False both for an address that was never proved AND for one that was
            proved and then moved — a changed address lands unverified.
        email_verified_at:
          type: string
          format: date-time
          description: |
            RFC3339 UTC, absent when `email_verified` is false. Judged against the
            service's clock, not the database's.

    EmailChange:
      type: object
      description: |
        The state of a two-sided address change.

        **Both addresses are named** and neither is secret: `current_email` is the
        address the account has now and `new_email` is the one that was typed. What
        it does not carry is a token, a digest or a row id — this flow is addressed
        by its tokens, and there is no id in it for a client to hold.

        On the `200` from `confirmEmailChangeNewAddress` the move has completed, so
        `current_email` and `new_email` are the same value, `expires_at` is absent,
        and `email_verified` is present and **false**.
      additionalProperties: false
      required: [current_email, new_email]
      properties:
        current_email:
          type: string
          format: email
          maxLength: 320
        new_email:
          type: string
          format: email
          maxLength: 320
        expires_at:
          type: string
          format: date-time
          description: |
            The deadline for the change. 24 hours from the request, and **both
            halves share it** rather than each getting its own clock — a change
            cannot be kept alive indefinitely by confirming the first half over and
            over. Absent once the move has completed.
        email_verified:
          type: boolean
          description: |
            Present only on the `200` from `confirmEmailChangeNewAddress`, where it
            is always false. An email change CLEARS the verification, so a client
            that reads this has to prompt for a fresh one rather than assuming the
            address it just moved to is proved.

    Problem:
      type: object
      description: |
        The cafaye error envelope: RFC 9457 plus core's `code` and `trace_id`.
        Every non-2xx response from this service is this shape. No service invents
        its own error body.
      required: [type, title, status, detail, instance, code, trace_id]
      properties:
        type:
          type: string
          format: uri
          description: 'A stable `https://errors.cafaye.com/<code>` URI — the machine-readable contract.'
          example: https://errors.cafaye.com/validation_failed
        title:
          type: string
          description: A fixed human-readable summary for the code. May be reworded without a version bump.
        status:
          type: integer
          description: The HTTP status, repeated in the body.
        detail:
          type: string
          description: |
            Specific to this occurrence and not parsed by clients. Never contains
            an internal error, a host, a role or a query fragment: those go to the
            log under the same `trace_id`.
        instance:
          type: string
          description: The request path. Never includes the query string, which can carry an address.
        code:
          type: string
          description: The last segment of `type`, in snake_case.
          enum:
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - validation_failed
            - rate_limited
            - idempotency_key_reused
            - internal
            - unavailable
            # This service's extensions to core's reserved list. core owns the
            # list; each of these is a case it does not currently describe.
            # See "Known gaps".
            - account_locked
            - method_not_allowed
            - invalid_json
            - payload_too_large
            - service_unavailable
        trace_id:
          type: string
          description: Always present, always equal to the `X-Trace-Id` response header.
        errors:
          type: array
          description: Per-field failures. Present only on 422.
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
          description: The request field that failed.
        code:
          type: string
          description: |
            A stable slug, safe to switch on. `required`, `invalid_format`,
            `too_short`, `too_long`.
          example: too_short

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        deps:
          type: string
          description: The dependencies probed, comma separated, or `none`. Present on `/readyz` only.

  responses:
    MailUnavailable:
      description: |
        This deployment has no mail delivery path, so it cannot send that link.

        A 503 and not a 500, because the caller can act on it: a product that sees
        this knows not to render "check your inbox", which is the whole reason it
        is not an opaque server error. And a 503 and not a 404, for the same reason
        `POST /v1/session/mfa` answers 503 — a 404 would say this service has never
        heard of password recovery, which is the one answer that is both false and
        useless.

        **It is checked before the address is looked up**, so a deployment that
        cannot send refuses a request for a registered address and one for an
        unregistered one in the same place. Without that ordering "503 against 202"
        would be an account-existence oracle, and it would be the most expensive one
        in this service to discover.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.cafaye.com/service_unavailable
            title: Service unavailable
            status: 503
            detail: this deployment cannot send email, so it cannot send that link
            instance: /v1/password-resets
            code: service_unavailable
            trace_id: 0af7651916cd43dd8448eb211c80319c
    Unauthenticated:
      description: |
        No usable credential: none was presented, or it is unknown, expired or
        revoked. One body for all four.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.cafaye.com/unauthorized
            title: Unauthorized
            status: 401
            detail: authentication is required to access this resource
            instance: /v1/me
            code: unauthorized
            trace_id: 0af7651916cd43dd8448eb211c80319c

    Forbidden:
      description: |
        The caller can see the resource and may not act on it. The route's minimum
        role is higher than theirs.

        Never used for "you are not a member of this account" — that is 404, so
        the response cannot confirm that an account id somebody guessed is real.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.cafaye.com/forbidden
            title: Forbidden
            status: 403
            detail: your role in this account does not permit this action
            instance: /v1/accounts/ab000000-0000-0000-0000-000000000000/oidc-clients
            code: forbidden
            trace_id: 0af7651916cd43dd8448eb211c80319c

    NotFound:
      description: |
        No such resource, or one this caller may not know about. One status and
        one sentence for both, because a 403 for "not a member" would confirm the
        account exists to somebody guessing ids.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.cafaye.com/not_found
            title: Not found
            status: 404
            detail: no such OIDC client is visible to you
            instance: /v1/accounts/ab000000-0000-0000-0000-000000000000/oidc-clients/cd000000-0000-0000-0000-000000000000
            code: not_found
            trace_id: 0af7651916cd43dd8448eb211c80319c

    ValidationFailed:
      description: The request was understood and is not acceptable. `errors[]` names the fields.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            passwordTooShort:
              summary: the password is under the minimum
              value:
                type: https://errors.cafaye.com/validation_failed
                title: Validation failed
                status: 422
                detail: the request has an invalid field
                instance: /v1/users
                code: validation_failed
                trace_id: 0af7651916cd43dd8448eb211c80319c
                errors:
                  - field: password
                    code: too_short
            unknownField:
              summary: the body has a field the endpoint does not accept
              value:
                type: https://errors.cafaye.com/validation_failed
                title: Validation failed
                status: 422
                detail: the request body has a field this endpoint does not accept
                instance: /v1/users
                code: validation_failed
                trace_id: 0af7651916cd43dd8448eb211c80319c

    MalformedBody:
      description: The body is not a JSON object this endpoint accepts.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.cafaye.com/invalid_json
            title: Malformed request body
            status: 400
            detail: the request body is not a JSON object this endpoint accepts
            instance: /v1/users
            code: invalid_json
            trace_id: 0af7651916cd43dd8448eb211c80319c

    BodyTooLarge:
      description: The body is larger than the 4096 bytes this endpoint accepts.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.cafaye.com/payload_too_large
            title: Request body too large
            status: 413
            detail: the request body is larger than the 4096 bytes this endpoint accepts
            instance: /v1/users
            code: payload_too_large
            trace_id: 0af7651916cd43dd8448eb211c80319c

    InternalError:
      description: |
        The request could not be completed. The cause is in the service's log
        under the returned `trace_id` and is never in the response.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.cafaye.com/internal
            title: Internal server error
            status: 500
            detail: the request could not be completed. Quote the trace id when reporting this.
            instance: /v1/users
            code: internal
            trace_id: 0af7651916cd43dd8448eb211c80319c

# ---------------------------------------------------------------------------
# Known gaps — departures from cafaye/core docs/openapi-conventions.md
#
# Each is a manager decision, not a local choice, and each is recorded here so it
# cannot be discovered by a consumer instead of by a reviewer.
#
# 1. `Idempotency-Key` is not accepted on POST /v1/users.
#
#    Core's checklist says every safely-retryable mutating POST must accept it.
#    Registration is safely retryable — a client that never saw the 201 should be
#    able to try again — so this endpoint owes the header.
#
#    Not implemented here because it needs its own retention table, a request-body
#    hash, the `(endpoint, principal, key)` scoping and the replay-versus-reuse
#    409, and a half-built version that accepts the header and ignores it is worse
#    than one that does not claim it. It is the first thing to add to this surface.
#
#    POST /v1/session is a deliberate exception and always will be: a login is not
#    safely repeatable, since retrying it mints a second session rather than
#    returning the first.
#
# 2. Four error codes are not in core's reserved list.
#
#    `account_locked` (423) is required by the brute-force lockout this packet
#    specifies, and core's list has no entry for a locked account. `invalid_json`
#    (400) and `payload_too_large` (413) are the honest answers for a
#    syntactically broken and an oversized body; folding them into
#    `validation_failed` would have reported both as semantic failures, and 400
#    for malformed syntax is exactly what core's own status conventions reserve.
#
#    `service_unavailable` (503) is the newest and the narrowest. It appears on
#    exactly one condition: `MFA_ENCRYPTION_KEY` is not configured, so the login's
#    second step exists, is reached, and cannot verify a code. It is a 503 and not
#    a 404 on purpose — a 404 would say this service has never heard of MFA, and
#    a client that believed that would be free to read the absence of a challenge
#    as the absence of a requirement and fall back to the password.
#
#    Note that core's list does carry a `unavailable` slug, and folding this into
#    it was the obvious option. It was rejected because `unavailable` is this
#    service's readiness-probe answer — the whole of its meaning is "a dependency
#    is down" — and one slug cannot also mean "this deployment is not configured to
#    do a thing it advertises". A client that wants to retry with backoff can key
#    on the status alone; a client that wants to tell the user "ask your
#    administrator" can key on this code, and that is the difference.
#
#    Proposal for core, not a fait accompli: add `account_locked` mapped to 423,
#    `service_unavailable` mapped to 503 and `payload_too_large` mapped to 413 to
#    the reserved list. `invalid_json` may be better folded into
#    `validation_failed` at 400, since core's list is keyed by slug and one slug
#    cannot carry two statuses.
#
# 3. `info.version` is set, and it is at 1.3.0.
#
#    core's versioning section carries an open decision (D4) about whether a
#    document version is required alongside the `/v1` path prefix, precisely
#    because two version numbers to keep in sync is a footgun. Setting it here
#    satisfies the stricter reading and costs nothing; the looser reading would
#    have core drop the field.
#
#  4. `GET /readyz` returns `{status, deps}` on 503, not a problem document.
#
#    This is a conflict between two authoritative sources, and neither should be
#    changed unilaterally by this packet.
#
#    core says every non-2xx response is `application/problem+json`. core's Problem
#    schema has nowhere to put a dependency list, and that list is the entire value
#    of `/readyz` to whoever is reading a failing probe.
#
#    The behaviour came from packet identity-01, which is merged and has tests
#    asserting it: AGENTS.md requires `/readyz` to "report which dependencies failed
#    by name", with the cause going to the log so an unauthenticated request cannot
#    learn that a database host sits at a particular address. That reasoning is
#    sound and this packet did not overturn it.
#
#    Resolution is the manager's: either core's envelope grows a place for probe
#    diagnostics, or `/readyz` is scoped out of the client contract as an
#    operational endpoint. The first is a core change, the second is a manifest
#    change, and both are core's call.
#
# Not gaps, recorded because a reviewer will ask:
#
#  * The `bearerToken` scheme is `http`/`bearer` with an opaque token, not a JWT.
#    core's auth section describes JWTs for service-to-service traffic verified
#    against identity's JWKS. BOTH credentials this scheme now accepts are
#    server-side row lookups: a session token and a scoped API token. Revocation is
#    a row write that takes effect on the next request, which a self-contained JWT
#    cannot do — and for a credential that lives a quarter rather than fifteen
#    minutes, that is the property worth having. The OIDC provider DOES issue JWTs,
#    and those are verified against the JWKS in `openid/openid.yaml`.
#  * A scoped API token is served by an **introspection endpoint on this
#    `/v1` surface**, not through the OIDC one, and the path is RFC 7662's *response*
#    shape rather than its `/introspect` path. The reason is that the credential is
#    first-party and opaque: there is no access token to introspect in the OAuth
#    sense, and `oidc.SetIntrospectionFromToken` still refuses. The OIDC
#    provider's introspection is a separate, unmounted feature for JWT access
#    tokens. If core decides an introspection path is fixed, this is the row that
#    has to change.
#  * Two decisions in this document are interim and marked as such: the **dual
#    scope claim** on the introspection response (`scopes` and `scope`, byte for
#    byte equal, pending MD7) and the **`account_id` floor with no `sub` fallback**.
#    Both are recorded where a consumer will read them rather than only in a
#    changelog, because a client integrating against the dual claim needs to know
#    that one of the two names is going away and that nothing has to be reissued
#    when it does.
#  * `POST /v1/session/mfa` is on the `sessions` tag, not the `mfa` one, and it is
#    mounted even in a deployment with no `MFA_ENCRYPTION_KEY`. It is the rest of
#    the login, it lives with the login, and it answers `503` rather than being
#    absent. A client must therefore not infer "MFA is off" from a 404 on a
#    management route — the only statement that MFA is off is a `200` from
#    `GET /v1/mfa` with `enabled: false`.
#  * There is no CSRF token on the cookie surface. `SameSite=Lax` plus a
#    state-changing surface that is POST/DELETE only and carries no ambient
#    authority covers the ordinary case; the explicit double-submit token belongs
#    with the browser app in `parlor`. It is a real gap, not a settled question.
#  * There is no `GET /v1/users/{id}`. Nothing needs it, and an endpoint that
#    exists only to be probed is an endpoint that leaks.
# ---------------------------------------------------------------------------
